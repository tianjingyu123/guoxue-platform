name: 工作台报告与AI权益真实库补验

on:
  push:
    branches: ["codex/image-verify-20260930"]
    paths: [".github/workflows/practitioner-report-verify.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report-real-db:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # 仅用于读取未发布的固定源码附件，不上传或发布业务成品。
    permissions:
      contents: write
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_USER: qa_report
          POSTGRES_PASSWORD: isolated-runner-only
          POSTGRES_DB: report_test_9c8e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U qa_report -d report_test_9c8e"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      SOURCE_COMMIT: "9c8e5e1a2a9a6090c2d4a87cfd8bbbfc31154f94"
      SOURCE_SHA256: "6f2bb4aff93cd16c4f94ccfa4667d8a9ba811b3df5db8d82226c35902b58e277"
      SOURCE_ASSET: "603772419"
      DATABASE_URL: "postgresql://qa_report:isolated-runner-only@127.0.0.1:5432/report_test_9c8e"
      XIAOBU_IT_DATABASE_URL: "postgresql://qa_report:isolated-runner-only@127.0.0.1:5432/report_test_9c8e"
      NODE_ENV: test
      BULLMQ_DISABLED: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          sparse-checkout: scripts/release
      - name: 清除检出鉴权头
        run: git config --local --unset-all http.https://github.com/.extraheader || true
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: "10.33.3"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.18.0"
      - name: 下载固定源码并核对摘要
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p results "$RUNNER_TEMP/report-source"
          archive="$RUNNER_TEMP/report-source.tar.gz"
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/tianjingyu123/guoxue-platform/releases/assets/$SOURCE_ASSET" \
            --output "$archive"
          printf '%s  %s\n' "$SOURCE_SHA256" "$archive" > "$archive.sha256"
          node scripts/release/verify-fixed-package.mjs "$archive" "$archive.sha256" \
            --expected-commit "$SOURCE_COMMIT" --report results/source-package.json
          tar -xzf "$archive" -C "$RUNNER_TEMP/report-source"
      - name: 核对真实 PostgreSQL 版本及初始化合成库
        run: |
          set -euo pipefail
          version=$(psql "$DATABASE_URL" -XAtc 'SHOW server_version')
          case "$version" in 18.4*) ;; *) echo '数据库版本不符'; exit 1;; esac
          printf '%s\n' "$version" > results/postgres-version.txt
          docker image inspect postgres:18.4 --format '{{json .RepoDigests}}' > results/postgres-image-digests.json
          source="$RUNNER_TEMP/report-source/apps/server/prisma/migrations-deploy"
          { printf 'BEGIN;\n'; cat "$source/full-baseline.sql" "$source/channel-operations.sql"; printf '\nCOMMIT;\n'; } \
            | psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 > results/schema.log
      - name: 在独立源码目录恢复依赖与 Prisma 客户端
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/report-source"
          pnpm install --frozen-lockfile
          pnpm --filter @guoxue/server exec prisma generate
          pnpm --filter @guoxue/shared build
          pnpm --filter @guoxue/bazi-engine build
          pnpm --filter @guoxue/ziwei-engine build
          pnpm --filter @guoxue/server build
      - name: 执行真实数据库并发与模拟供应商接口验证
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE"
          cd "$RUNNER_TEMP/report-source/apps/server"
          pnpm exec jest --runInBand --no-coverage --json --outputFile "$root/results/jest-result.json" \
            --testPathPattern='modules/practitioner/|voice/(voice-quota.service|voice-topup|xiaobu-commerce|voice-session|voice-http|circle-voice-revenue|voice-device-handoff)\.integration\.spec|classic/classic-derived\.integration\.spec' \
            2>&1 | tee "$root/results/jest.log"
      - name: 检查编译产物的报告锁与实际并发
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/report-source/apps/server"
          node <<'NODE'
          const fs = require('fs');
          const assert = require('assert/strict');
          const { PrismaClient } = require('@prisma/client');
          const { PractitionerService } = require('./dist/modules/practitioner/practitioner.service');
          const prisma = new PrismaClient();
          const id = 'compiled-report-9c8e';
          (async () => {
            const version = await prisma.$queryRawUnsafe('SHOW server_version');
            await prisma.user.create({data:{id,nickname:'合成编译报告并发'}});
            await prisma.practitionerReport.createMany({data:[1,2].map(i=>({ownerId:id,type:'bazi',typeLabel:'八字命书',title:'已有'+i,clientName:'合成用户'}))});
            const svc = new PractitionerService(prisma,{assertReportAccess:async()=>({granted:true})});
            const result = await Promise.allSettled([1,2].map(i=>svc.createReport(id,{type:'bazi',typeLabel:'八字命书',title:'并发'+i,clientName:'合成用户'})));
            assert.equal(result.filter(r=>r.status==='fulfilled').length,1);
            const rejected = result.find(r=>r.status==='rejected');
            assert.match(rejected.reason.message,/免费版最多保存/);
            assert.equal(await prisma.practitionerReport.count({where:{ownerId:id}}),3);
            fs.writeFileSync(process.env.GITHUB_WORKSPACE+'/results/compiled-report.json',JSON.stringify({sourceCommit:process.env.SOURCE_COMMIT,sourceSha256:process.env.SOURCE_SHA256,version,compiledService:true,concurrentRequests:2,created:1,quotaRejected:1,stored:3,passed:true})+'\n');
          })().catch(e=>{console.error(e);process.exitCode=1}).finally(async()=>{
            await prisma.practitionerReport.deleteMany({where:{ownerId:id}});
            await prisma.user.deleteMany({where:{id}});
            await prisma.$disconnect();
          });
          NODE
      - name: 保存限定范围验证证据
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: report-real-db-9c8e5e1a2-${{ github.run_id }}
          path: results/
          retention-days: 14
          if-no-files-found: error
