name: 最终固定包镜像身份与前端绑定核验

on:
  push:
    branches: ["codex/image-verify-20260930"]
    paths:
      - ".github/workflows/image-binding.yml"
      - "scripts/release/verify-linux-artifact-binding.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: final-image-binding-${{ github.ref }}
  cancel-in-progress: false

jobs:
  artifact-binding:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: write
    env:
      SOURCE_COMMIT: "43de59acf81e7d622edc4e57285ddf41b7ad89f2"
      SOURCE_SHA256: "dfa73eb2b911f64e02595f19a468be0a339f2211052196feb93d10b779f29752"
      IMAGE_TAG: "rebu-linux-verify:43de59ac"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          sparse-checkout: scripts/release

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.18.0"

      - name: 下载验真最终固定包
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results "$RUNNER_TEMP/rebu-image-source"
          archive="$RUNNER_TEMP/gx-deploy-91-launch-20260930-43de59ac.tar.gz"
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/octet-stream" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/tianjingyu123/guoxue-platform/releases/assets/601777796 \
            --output "$archive"
          printf '%s  %s\n' "$SOURCE_SHA256" "$archive" > "$archive.sha256"
          node scripts/release/verify-fixed-package.mjs "$archive" "$archive.sha256" \
            --expected-commit "$SOURCE_COMMIT" --report results/source-package.json
          tar -xzf "$archive" -C "$RUNNER_TEMP/rebu-image-source"

      - name: 用正式Dockerfile构建本版镜像
        timeout-minutes: 40
        shell: bash
        run: |
          set -euo pipefail
          docker build --platform linux/amd64 --progress plain \
            --label "org.opencontainers.image.revision=$SOURCE_COMMIT" \
            --label "rebu.source-archive.sha256=$SOURCE_SHA256" \
            --build-arg VITE_API_URL=https://api.rebugx.cn \
            --build-arg VITE_PUBLIC_H5_URL=https://gx.yrydai.com/h5/ \
            --build-arg VITE_PUBLIC_ASSET_ORIGIN=https://static.rebugx.cn \
            -f "$RUNNER_TEMP/rebu-image-source/docker/Dockerfile" \
            -t "$IMAGE_TAG" "$RUNNER_TEMP/rebu-image-source" 2>&1 | tee results/image-build.log

      - name: 核镜像来源Prisma和新H5挂载
        timeout-minutes: 5
        run: node scripts/release/verify-linux-artifact-binding.mjs

      - name: 保存绑定证据
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-image-binding-43de59ac-${{ github.run_id }}
          path: results/
          retention-days: 14
          if-no-files-found: error
