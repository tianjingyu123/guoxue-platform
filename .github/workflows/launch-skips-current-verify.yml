name: 当前完整候选592项软件跳过补验
on:
  push:
    branches: [codex/launch-skips-cc78-20261003]
    paths: [.github/workflows/launch-skips-current-verify.yml, scripts/release/verify-current-software-skips.cjs, scripts/release/skipped-case-manifest-cc78.json]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_COMMIT: cc78fbe4f7cc4d7e7489a877b1f2c6252f1b396e
      DATABASE_URL: postgresql://qa_voice:synthetic-test-only@127.0.0.1:55462/software_test_cc78
      XIAOBU_IT_DATABASE_URL: postgresql://qa_voice:synthetic-test-only@127.0.0.1:55462/software_test_cc78
      XIAOBU_IT_REDIS_URL: redis://127.0.0.1:6379
      BOT_QUOTA_TEST_DATABASE_URL: postgresql://qa_voice:synthetic-test-only@127.0.0.1:55462/bot_quota_qa_cc78
      ENTITLEMENT_NOTICE_TEST_DATABASE_URL: postgresql://qa_voice:synthetic-test-only@127.0.0.1:55462/entitlement_notice_qa_skips_cc78
      REBU_LOCAL_ORDER_TEST_URL: postgresql://rebu_test:synthetic-test-only@127.0.0.1:55439/rebu_candidate_test
      REBU_LOCAL_PAYMENT_TEST_URL: postgresql://rebu_test:synthetic-test-only@127.0.0.1:55439/rebu_candidate_test
      REBU_LOCAL_REFUND_TEST_URL: postgresql://rebu_test:synthetic-test-only@127.0.0.1:55439/rebu_candidate_test
      REBU_LOCAL_AFTER_SALE_TEST_URL: postgresql://rebu_test:synthetic-test-only@127.0.0.1:55439/rebu_candidate_test
      REBU_LOCAL_NOTIFICATION_TEST_URL: postgresql://rebu_test:synthetic-test-only@127.0.0.1:55439/rebu_candidate_test
      REBU_LOCAL_COURSE_ACCESS_TEST_URL: postgresql://rebu_test:synthetic-test-only@127.0.0.1:55439/rebu_candidate_test
      REBU_LOCAL_REVIEW_TEST_URL: postgresql://rebu_test:synthetic-test-only@127.0.0.1:55439/rebu_candidate_test
      NODE_ENV: test
      BULLMQ_DISABLED: "true"
      PGPASSWORD: synthetic-test-only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          sparse-checkout: scripts/release
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: cc78fbe4f7cc4d7e7489a877b1f2c6252f1b396e
          path: candidate
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/.claude/
      - name: 清除临时检出鉴权头
        run: |
          git config --local --unset-all http.https://github.com/.extraheader || true
          git -C candidate config --local --unset-all http.https://github.com/.extraheader || true
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.33.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: candidate/pnpm-lock.yaml
      - name: 独立PG18.4与Redis及依赖
        run: |
          set -euo pipefail
          mkdir -p candidate/artifacts/current-skips
          test "$(git -C candidate rev-parse HEAD)" = "$SOURCE_COMMIT"
          docker build -f scripts/release/isolated-pg18-4-vector.Dockerfile -t rebu-skips-vector scripts/release > candidate/artifacts/current-skips/database-image.log 2>&1
          docker run -d --name rebu-skips-db -p 55462:5432 -p 55439:5432 -e POSTGRES_USER=qa_voice -e POSTGRES_PASSWORD=synthetic-test-only -e POSTGRES_DB=software_test_cc78 rebu-skips-vector
          docker run -d --name rebu-skips-redis -p 6379:6379 redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
          for attempt in $(seq 1 30); do pg_isready -h 127.0.0.1 -p 55462 -U qa_voice && break; sleep 2; done
          pnpm -C candidate install --frozen-lockfile
          pnpm -C candidate --filter @guoxue/server exec prisma generate
          pnpm -C candidate --filter @guoxue/shared build
          pnpm -C candidate --filter @guoxue/bazi-engine build
          pnpm -C candidate --filter @guoxue/ziwei-engine build
      - name: 四个专用空库与完整136迁移基线
        working-directory: candidate
        run: |
          set -euo pipefail
          version=$(psql "$DATABASE_URL" -XAtc 'SHOW server_version')
          case "$version" in 18.4*) ;; *) exit 1;; esac
          printf '%s\n' "$version" > artifacts/current-skips/postgres-version.txt
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -c "CREATE ROLE rebu_test LOGIN SUPERUSER PASSWORD 'synthetic-test-only'"
          createdb -h 127.0.0.1 -p 55462 -U qa_voice bot_quota_qa_cc78
          createdb -h 127.0.0.1 -p 55462 -U qa_voice entitlement_notice_qa_skips_cc78
          createdb -h 127.0.0.1 -p 55462 -U qa_voice -O rebu_test rebu_candidate_test
          for database in software_test_cc78 bot_quota_qa_cc78 entitlement_notice_qa_skips_cc78 rebu_candidate_test; do
            DATABASE_URL="postgresql://qa_voice:synthetic-test-only@127.0.0.1:55462/$database" CONFIRM_EMPTY_DATABASE=YES sh apps/server/prisma/migrations-deploy/bootstrap-empty-database.sh > "artifacts/current-skips/bootstrap-$database.log" 2>&1
            psql "postgresql://qa_voice:synthetic-test-only@127.0.0.1:55462/$database" -X -v ON_ERROR_STOP=1 -c 'DELETE FROM "MemberConfig"' > /dev/null
          done
      - name: 仅本版592项软件用例补验
        working-directory: candidate
        run: node ../scripts/release/verify-current-software-skips.cjs
      - name: 清理专用隔离容器
        if: always()
        run: |
          docker rm -f rebu-skips-db || true
          docker rm -f rebu-skips-redis || true
      - name: 保存源码与逐例结果
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: software-skips-current-cc78
          path: candidate/artifacts/current-skips/
          retention-days: 30
