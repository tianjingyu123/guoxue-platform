name: 最终安全补丁版五端与固定包隔离验证
on:
  push:
    branches: [codex/braces-build-verify-20261002]
    paths: [.github/workflows/final-package-verify.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: final-package-verify-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      SOURCE_COMMIT: 1abd0eb7b5d6f225d26c6b2d5b83d6b32d42c40d
      RELEASE_ID: launch-20261002-1abd0eb7b
      NODE_OPTIONS: --max-old-space-size=6144
      VITE_API_URL: https://api.rebugx.cn
      VITE_PUBLIC_H5_URL: https://gx.yrydai.com/h5/
      VITE_PUBLIC_ASSET_ORIGIN: https://static.rebugx.cn
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          persist-credentials: true
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/.claude/
      - name: 验证独立来源并清除临时鉴权
        run: |
          set -euo pipefail
          git config --local --unset-all http.https://github.com/.extraheader || true
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          git switch -c codex/final-package-1abd0eb7b
          mkdir -p artifacts/final-package
          git rev-parse HEAD > artifacts/final-package/source-binding.txt
          git ls-files -z package.json pnpm-lock.yaml patches apps/mobile apps/admin packages apps/server/src apps/server/prisma docker scripts/release | xargs -0 sha256sum >> artifacts/final-package/source-binding.txt
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.33.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
          cache: pnpm
      - name: 独立冻结依赖与补丁核验
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm release:test-braces-depth 2>&1 | tee artifacts/final-package/braces-tests.log
          pnpm release:audit-deps 2>&1 | tee artifacts/final-package/dependency-audit.log
      - name: 固定公开配置并构建各端
        run: |
          set -euo pipefail
          printf '%s\n' "VITE_API_URL=$VITE_API_URL" "VITE_PUBLIC_H5_URL=$VITE_PUBLIC_H5_URL" "VITE_PUBLIC_ASSET_ORIGIN=$VITE_PUBLIC_ASSET_ORIGIN" > artifacts/final-package/public-config.env
          cp artifacts/final-package/public-config.env apps/mobile/.env.production
          cp artifacts/final-package/public-config.env apps/admin/.env.production
          pnpm --filter @guoxue/shared build 2>&1 | tee artifacts/final-package/shared-build.log
          pnpm --filter @guoxue/bazi-engine build 2>&1 | tee artifacts/final-package/bazi-build.log
          pnpm --filter @guoxue/ziwei-engine build 2>&1 | tee artifacts/final-package/ziwei-build.log
          pnpm --filter @guoxue/admin build 2>&1 | tee artifacts/final-package/admin-build.log
          pnpm --filter @guoxue/mobile build:h5 2>&1 | tee artifacts/final-package/h5-build.log
          pnpm --filter @guoxue/mobile build:mp-weixin 2>&1 | tee artifacts/final-package/mp-build.log
          pnpm --filter @guoxue/mobile build:app 2>&1 | tee artifacts/final-package/app-build.log
          pnpm --filter @guoxue/mobile build:app-harmony 2>&1 | tee artifacts/final-package/harmony-build.log
      - name: 成品独立验真及来源冻结
        run: |
          set -euo pipefail
          node scripts/release/create-client-config-binding.mjs artifacts/final-package/public-config.env --release-id "$RELEASE_ID" --source-commit "$SOURCE_COMMIT" --output artifacts/final-package/client-config.json
          node scripts/release/audit-client-artifacts.mjs artifacts/final-package/public-config.env --release-id "$RELEASE_ID" --source-commit "$SOURCE_COMMIT" --report artifacts/final-package/client-artifacts.json 2>&1 | tee artifacts/final-package/client-audit.log
          node scripts/release/verify-client-artifacts.mjs artifacts/final-package/client-artifacts.json --expected-release-id "$RELEASE_ID" --expected-commit "$SOURCE_COMMIT" --output artifacts/final-package/client-artifacts-verified.json 2>&1 | tee artifacts/final-package/client-verify.log
          node scripts/release/audit-source-freeze.mjs --strict --expected-branch codex/final-package-1abd0eb7b --expected-commit "$SOURCE_COMMIT" --report artifacts/final-package/source-freeze.json 2>&1 | tee artifacts/final-package/source-freeze.log
      - name: 生成与核验独立固定包
        run: |
          set -euo pipefail
          node scripts/release/create-fixed-package.mjs "$RELEASE_ID" --client-config-binding artifacts/final-package/client-config.json --client-artifact-audit artifacts/final-package/client-artifacts.json --client-artifact-verification artifacts/final-package/client-artifacts-verified.json --source-freeze-audit artifacts/final-package/source-freeze.json 2>&1 | tee artifacts/final-package/create-fixed.log
          node scripts/release/verify-fixed-package.mjs "artifacts/releases/gx-deploy-91-$RELEASE_ID.tar.gz" "artifacts/releases/gx-deploy-91-$RELEASE_ID.tar.gz.sha256" --expected-commit "$SOURCE_COMMIT" --report artifacts/final-package/fixed-package-verified.json 2>&1 | tee artifacts/final-package/verify-fixed.log
          cp "artifacts/releases/gx-deploy-91-$RELEASE_ID.tar.gz" artifacts/final-package/
          cp "artifacts/releases/gx-deploy-91-$RELEASE_ID.tar.gz.sha256" artifacts/final-package/
          tar -czf artifacts/final-package/client-products.tar.gz apps/admin/dist apps/mobile/dist/build/h5 apps/mobile/dist/build/mp-weixin apps/mobile/dist/build/app apps/mobile/dist/build/app-harmony
          node -e 'const fs=require("fs");fs.writeFileSync("artifacts/final-package/summary.json",JSON.stringify({sourceCommit:process.env.SOURCE_COMMIT,releaseId:process.env.RELEASE_ID,targets:5,passed:true,officialUpload:false,signedPackage:false,newDeviceTest:false,production:false}))'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: final-package-${{ env.SOURCE_COMMIT }}-${{ github.run_id }}
          path: artifacts/final-package/
          retention-days: 14
          if-no-files-found: error
