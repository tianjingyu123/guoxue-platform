name: braces安全补丁与各端隔离构建验证
on:
  push:
    branches: [codex/braces-build-verify-20261002]
    paths: [.github/workflows/braces-depth-verify.yml, scripts/release/verify-isolated-braces-depth.cjs]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: braces-depth-verify-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_COMMIT: 85192ea3cb962133c00c6564c56057667d8ea2da
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: scripts/release/verify-isolated-braces-depth.cjs
          persist-credentials: true
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          path: candidate
          persist-credentials: true
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/.claude/
      - name: 清除检出的临时鉴权
        run: |
          git config --local --unset-all http.https://github.com/.extraheader || true
          git -C candidate config --local --unset-all http.https://github.com/.extraheader || true
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.33.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: candidate/pnpm-lock.yaml
      - name: 独立冻结依赖与原包反证
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$SOURCE_COMMIT"
          mkdir -p original candidate/artifacts/braces-depth
          printf '%s\n' '{"private":true,"dependencies":{"braces":"3.0.3"}}' > original/package.json
          printf '%s\n' 'packages: []' > original/pnpm-workspace.yaml
          pnpm --dir original install --ignore-scripts
          pnpm --dir candidate install --frozen-lockfile
          cd candidate
          git rev-parse HEAD > artifacts/braces-depth/source-binding.txt
          git ls-files package.json pnpm-lock.yaml patches apps/mobile apps/admin packages | xargs sha256sum >> artifacts/braces-depth/source-binding.txt
          node ../scripts/release/verify-isolated-braces-depth.cjs
      - name: 固定公开目标配置与五端构建
        working-directory: candidate
        run: |
          set -euo pipefail
          printf '%s\n' 'VITE_API_URL=https://api.rebugx.cn' 'VITE_PUBLIC_H5_URL=https://gx.yrydai.com/h5/' 'VITE_PUBLIC_ASSET_ORIGIN=https://static.rebugx.cn' > apps/mobile/.env.production
          cp apps/mobile/.env.production artifacts/braces-depth/public-config.env
          pnpm --filter @guoxue/shared build 2>&1 | tee artifacts/braces-depth/shared-build.log
          pnpm --filter @guoxue/bazi-engine build 2>&1 | tee artifacts/braces-depth/bazi-build.log
          pnpm --filter @guoxue/ziwei-engine build 2>&1 | tee artifacts/braces-depth/ziwei-build.log
          pnpm --filter @guoxue/admin build 2>&1 | tee artifacts/braces-depth/admin-build.log
          pnpm --filter @guoxue/mobile build:h5 2>&1 | tee artifacts/braces-depth/h5-build.log
          pnpm --filter @guoxue/mobile build:mp-weixin 2>&1 | tee artifacts/braces-depth/mp-build.log
          pnpm --filter @guoxue/mobile build:app 2>&1 | tee artifacts/braces-depth/app-build.log
          pnpm --filter @guoxue/mobile build:app-harmony 2>&1 | tee artifacts/braces-depth/harmony-build.log
          git diff --exit-code -- package.json pnpm-lock.yaml patches
          node -e 'const fs=require("fs");fs.writeFileSync("artifacts/braces-depth/build-summary.json",JSON.stringify({sourceCommit:process.env.SOURCE_COMMIT,targets:["admin","h5","mp-weixin","app","app-harmony"],passed:true,officialUpload:false,signedPackage:false,newDeviceTest:false,production:false}))'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: braces-depth-${{ env.SOURCE_COMMIT }}-${{ github.run_id }}
          path: candidate/artifacts/braces-depth
          if-no-files-found: error
          retention-days: 14
