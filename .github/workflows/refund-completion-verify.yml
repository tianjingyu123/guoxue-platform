name: 退款完成通知最终收口隔离验证

on:
  push:
    branches: [codex/refund-completion-verify-20261002]
    paths: [.github/workflows/refund-completion-verify.yml, scripts/release/verify-isolated-refund-completion.cjs]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.4-trixie@sha256:4cc13dede823cab4e05290c7fb3350fb4e599ecabd9b07e6706b5d5e8f5bc929
        env:
          POSTGRES_USER: qa_voice
          POSTGRES_PASSWORD: synthetic-test-only
          POSTGRES_DB: entitlement_notice_qa_refund_completion_linux
        ports: ["55462:5432"]
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U qa_voice -d entitlement_notice_qa_refund_completion_linux"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://qa_voice:synthetic-test-only@127.0.0.1:55462/entitlement_notice_qa_refund_completion_linux
      ENTITLEMENT_NOTICE_TEST_DATABASE_URL: postgresql://qa_voice:synthetic-test-only@127.0.0.1:55462/entitlement_notice_qa_refund_completion_linux
      SOURCE_COMMIT: f2c7ccec4737e175a3df5550f5b1bc788ed1d2c7
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/refund-completion-verify.yml
            /scripts/release/verify-isolated-refund-completion.cjs
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          fetch-depth: 1
          path: candidate
          persist-credentials: true
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/.claude/
      - name: 清除临时检出鉴权
        run: |
          git config --local --unset-all http.https://github.com/.extraheader || true
          git -C candidate config --local --unset-all http.https://github.com/.extraheader || true
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.33.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: candidate/pnpm-lock.yaml
      - name: 固定身份、独立依赖与专用合成库
        working-directory: candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          mkdir -p artifacts/refund-completion-boundary
          git rev-parse HEAD > artifacts/refund-completion-boundary/source-binding.txt
          git ls-files apps/server/src apps/server/prisma/schema.prisma apps/server/prisma/migrations pnpm-lock.yaml | xargs sha256sum >> artifacts/refund-completion-boundary/source-binding.txt
          pnpm install --frozen-lockfile
          pnpm --filter @guoxue/server exec prisma generate
          pnpm --filter @guoxue/shared build
          pnpm --filter @guoxue/bazi-engine build
          pnpm --filter @guoxue/ziwei-engine build
          # 本专项验证退款收口；完整135空库入口已在910正式镜像单独实测，不能将db push算作迁移验收。
          pnpm --filter @guoxue/server exec prisma db push --skip-generate
      - name: 退款通知及付款权益定向回归
        working-directory: candidate/apps/server
        run: |
          set -euo pipefail
          pnpm exec jest --runInBand --no-coverage --runTestsByPath src/modules/shop/refund-completion-boundary.postgres.spec.ts src/modules/shop/shop-refund.service.spec.ts src/modules/shop/shop-payment.service.spec.ts src/modules/shop/payment-ack-boundary.postgres.spec.ts src/modules/shop/school-member-entitlement.postgres.spec.ts src/modules/shop/practitioner-entitlement.postgres.spec.ts --json --outputFile ../../artifacts/refund-completion-boundary/jest-results.json 2>&1 | tee ../../artifacts/refund-completion-boundary/jest.log
          node -e 'const x=require("../../artifacts/refund-completion-boundary/jest-results.json");if(x.numPassedTests!==194||x.numFailedTests||x.numPendingTests||x.numPassedTestSuites!==6)throw Error("定向数量或状态不符")'
          node -e 'require("fs").writeFileSync(".qa-refund-types.json",JSON.stringify({extends:"./tsconfig.jest.json",compilerOptions:{incremental:false},include:["src/types/express.d.ts","src/types/lunar-javascript.d.ts","src/types/sweph.d.ts","src/modules/shop/shop-refund.service.ts","src/modules/shop/shop-refund.service.spec.ts","src/modules/shop/refund-completion-boundary.postgres.spec.ts"],exclude:["node_modules","dist"]}))'
          cp .qa-refund-types.json ../../artifacts/refund-completion-boundary/spec-types.json
          pnpm exec tsc --noEmit -p .qa-refund-types.json 2>&1 | tee ../../artifacts/refund-completion-boundary/typecheck.log
          rm .qa-refund-types.json
          pnpm exec eslint src/modules/shop/shop-refund.service.ts src/modules/shop/shop-refund.service.spec.ts src/modules/shop/refund-completion-boundary.postgres.spec.ts --format json --output-file ../../artifacts/refund-completion-boundary/lint.json
          pnpm build 2>&1 | tee ../../artifacts/refund-completion-boundary/build.log
      - name: 编译服务真实数据库验证
        working-directory: candidate
        run: node ../scripts/release/verify-isolated-refund-completion.cjs
      - name: 归档证据
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: refund-completion-boundary-${{ env.SOURCE_COMMIT }}
          path: candidate/artifacts/refund-completion-boundary/
          retention-days: 30
