name: Android 托管SDK已有许可只读预检
on:
  push:
    branches: [codex/channel-linux-probe-20261001]
permissions:
  contents: read
concurrency:
  group: channel-native-probe-${{ github.ref }}
  cancel-in-progress: false
jobs:
  existing-license:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: 获取本次公开测试提交
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin https://github.com/tianjingyu123/guoxue-platform.git
          git -c protocol.version=2 fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: 官方SDK许可API只读回查
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/linux-native-probe "$RUNNER_TEMP/license-check"
          curl --fail --proto '=https' --tlsv1.2 --max-time 45 https://dl.google.com/android/repository/sys-img/google_apis/sys-img2-4.xml -o artifacts/linux-native-probe/sdk-sys-img2-4.xml
          sha256sum artifacts/linux-native-probe/sdk-sys-img2-4.xml > artifacts/linux-native-probe/metadata.sha256
          javac -encoding UTF-8 -cp "$ANDROID_HOME/cmdline-tools/latest/lib/*" -d "$RUNNER_TEMP/license-check" .github/native-probe/ExistingSdkLicense.java
          java -cp "$RUNNER_TEMP/license-check:$ANDROID_HOME/cmdline-tools/latest/lib/*" ExistingSdkLicense "$ANDROID_HOME" artifacts/linux-native-probe/sdk-sys-img2-4.xml | tee artifacts/linux-native-probe/preview-license-readonly.json
      - name: 保存只读预检证据
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sdk-existing-license-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: artifacts/linux-native-probe/
