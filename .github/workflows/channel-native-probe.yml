name: Android 独立探针 API29与30

on:
  push:
    branches: [codex/channel-linux-probe-20261001]

permissions:
  contents: read

concurrency:
  group: channel-native-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        api: [29, 30]
    env:
      PROBE_API: ${{ matrix.api }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
      - name: 同一APK与原脚本验收
        run: bash .github/native-probe/run-linux.sh
      - name: 保留独立验收证据
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-probe-api${{ matrix.api }}-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: |
            artifacts/linux-native-probe/
            artifacts/phase18-probe-log-stream-android-phase18-api${{ matrix.api }}-core-retry3/
            docs/operations/channel-updates-evidence/android-phase18-api${{ matrix.api }}-core-retry3.json
