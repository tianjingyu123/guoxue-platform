name: Android SDK实际目录加载器许可只读核验
on:
  push:
    branches: [codex/channel-linux-probe-20261001]
permissions:
  contents: read
concurrency:
  group: channel-native-probe-${{ github.ref }}
  cancel-in-progress: false
jobs:
  existing-license:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: 获取并核验本次独立测试提交
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin https://github.com/tianjingyu123/guoxue-platform.git
          git -c protocol.version=2 fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: 官方SDK目录加载器只读回查
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/linux-native-probe "$RUNNER_TEMP/loaded-license-check"
          curl --fail --proto '=https' --tlsv1.2 --max-time 45 https://dl.google.com/android/repository/sys-img/android/sys-img2-4.xml -o artifacts/linux-native-probe/sdk-aosp-catalog.xml
          test "$(sha256sum artifacts/linux-native-probe/sdk-aosp-catalog.xml | cut -d ' ' -f1)" = fea06dcf5b6eed13d0cb9c8e06decd60dce36ac9eb3af0d2bb671edd96d77b50
          javac -encoding UTF-8 -cp "$ANDROID_HOME/cmdline-tools/latest/lib/*" -d "$RUNNER_TEMP/loaded-license-check" .github/native-probe/OfficialLoadedSdkLicenses.java
          java -cp "$RUNNER_TEMP/loaded-license-check:$ANDROID_HOME/cmdline-tools/latest/lib/*" OfficialLoadedSdkLicenses "$ANDROID_HOME" artifacts/linux-native-probe/sdk-aosp-catalog.xml | tee artifacts/linux-native-probe/official-loaded-license-readonly.jsonl
      - name: 保存只读核验原始证据
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sdk-loaded-license-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: artifacts/linux-native-probe/
