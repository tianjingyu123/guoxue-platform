name: 首轮固定包Linux镜像隔离验收
on:
  push:
    branches: [codex/image-verify-current-20261003]
    paths:
      - .github/workflows/image-verify-current.yml
      - scripts/release/verify-linux-image-runtime.mjs
      - scripts/release/verify-isolated-*.cjs
permissions:
  contents: read
concurrency:
  group: first-launch-image-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  image-verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      SOURCE_COMMIT: 7c060d32ff72b6594a36f894a11cb7d54975d2dc
      SOURCE_SHA256: 5c4a487ea9d72d385c1135dda8699c64273934c45b6122ca1fe78e558476c46a
      IMAGE_TAG: rebu-linux-verify:7c060d32f
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          sparse-checkout: scripts/release
      - name: 清除临时检出鉴权头
        run: git config --local --unset-all http.https://github.com/.extraheader || true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
      - name: 只读取草稿附件并验真固定输入
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p results "$RUNNER_TEMP/rebu-image-source"
          archive="$RUNNER_TEMP/gx-deploy-91-launch-20261003-7c060d32f.tar.gz"
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/tianjingyu123/guoxue-platform/releases/assets/607846666 \
            --output "$archive"
          printf '%s  %s\n' "$SOURCE_SHA256" "$archive" > "$archive.sha256"
          node scripts/release/verify-fixed-package.mjs "$archive" "$archive.sha256" \
            --expected-commit "$SOURCE_COMMIT" --report results/source-package.json
          tar -xzf "$archive" -C "$RUNNER_TEMP/rebu-image-source"
      - name: 构建隔离PG18.4向量基座
        timeout-minutes: 10
        run: |
          set -euo pipefail
          docker build --platform linux/amd64 --progress plain \
            -f scripts/release/isolated-pg18-4-vector.Dockerfile \
            -t rebu-isolated-pg18.4-vector:frozen scripts/release 2>&1 | tee results/database-image-build.log
      - name: 用正式Dockerfile构建固定源码镜像
        timeout-minutes: 40
        run: |
          set -euo pipefail
          docker build --platform linux/amd64 --progress plain \
            --label "org.opencontainers.image.revision=$SOURCE_COMMIT" \
            --label "rebu.source-archive.sha256=$SOURCE_SHA256" \
            --build-arg VITE_API_URL=https://api.rebugx.cn \
            --build-arg VITE_PUBLIC_H5_URL=https://gx.yrydai.com/h5/ \
            --build-arg VITE_PUBLIC_ASSET_ORIGIN=https://static.rebugx.cn \
            -f "$RUNNER_TEMP/rebu-image-source/docker/Dockerfile" \
            -t "$IMAGE_TAG" "$RUNNER_TEMP/rebu-image-source" 2>&1 | tee results/image-build.log
      - name: 核验实际运行镜像及临时空库业务入口
        timeout-minutes: 12
        run: node scripts/release/verify-linux-image-runtime.mjs
      - name: 保留本轮实际验收镜像并记录原字节摘要
        run: |
          set -euo pipefail
          docker save "$IMAGE_TAG" | gzip -1 > results/rebu-server-7c060d32f-image.tar.gz
          sha256sum results/rebu-server-7c060d32f-image.tar.gz > results/rebu-server-7c060d32f-image.tar.gz.sha256
          docker image inspect "$IMAGE_TAG" > results/image-inspect.json
      - name: 保存独立证据及通过后的实际镜像
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: first-launch-linux-image-${{ env.SOURCE_COMMIT }}-${{ github.run_id }}
          path: results/
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
