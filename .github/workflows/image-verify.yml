name: 固定源码包 Linux 镜像隔离验证

on:
  push:
    branches: ["codex/image-verify-20260930"]
    paths:
      - ".github/workflows/image-verify.yml"
      - "scripts/release/verify-linux-image-runtime.mjs"
      - "scripts/release/verify-isolated-course-reminder.cjs"
      - "scripts/release/verify-isolated-free-course-http.cjs"
      - "scripts/release/verify-isolated-live-booking.cjs"
      - "scripts/release/verify-isolated-payment-http.cjs"
      - "scripts/release/verify-isolated-circle-recall-http.cjs"
      - "scripts/release/verify-isolated-circle-auto-refund-http.cjs"
      - "scripts/release/verify-isolated-merchant-shipping-http.cjs"
      - "scripts/release/verify-isolated-im-http.cjs"
      - "scripts/release/verify-isolated-im-socket.cjs"
      - "scripts/release/verify-isolated-circle-reward-http.cjs"
      - "scripts/release/verify-isolated-circle-post-detail-http.cjs"
      - "scripts/release/verify-isolated-competition-disclosure-http.cjs"
      - "scripts/release/verify-isolated-channel-operations-http.cjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # 每轮使用独立托管运行器和临时数据库，不共享生产或外部资源。
  # 独立分组避免已中断任务的状态未收口时阻塞后续验包；仍禁止自动取消其他任务。
  group: image-verification-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  image-verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # GitHub 草稿附件仅对有推送权限的令牌可读；此任务只下载，不发布或推送镜像。
    permissions:
      contents: write
    env:
      SOURCE_COMMIT: "9695462de758faff9a0d278d5197aeb118bf986b"
      SOURCE_SHA256: "1e094516318c0f77f4b2984b82605603080296ea5dbf2faf15dedd1684b2954c"
      IMAGE_TAG: "rebu-linux-verify:9695462de"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # 与已通过的 CI 相同：令牌只留在临时检出配置，既不进入构建上下文也不归档。
          # 关闭持久化会触发 checkout 的历史 gitlink 清理缺陷，导致取包前失败。
          persist-credentials: true
          # 仅检出核验脚本，避开历史缺少 .gitmodules 声明的技能 gitlink。
          # 实际业务构建仍来自完整固定源码包，而不是这份稀疏检出。
          sparse-checkout: scripts/release

      - name: 清除临时检出鉴权头
        shell: bash
        run: git config --local --unset-all http.https://github.com/.extraheader || true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.18.0"

      - name: 下载并验真固定源码包
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results "$RUNNER_TEMP/rebu-image-source"
          archive="$RUNNER_TEMP/gx-deploy-91-launch-20261001-9695462de.tar.gz"
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/octet-stream" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/tianjingyu123/guoxue-platform/releases/assets/603676198 \
            --output "$archive"
          printf '%s  %s\n' "$SOURCE_SHA256" "$archive" > "$archive.sha256"
          node scripts/release/verify-fixed-package.mjs "$archive" "$archive.sha256" \
            --expected-commit "$SOURCE_COMMIT" --report results/source-package.json
          tar -xzf "$archive" -C "$RUNNER_TEMP/rebu-image-source"

      - name: 使用正式 Dockerfile 构建 Linux 镜像
        timeout-minutes: 40
        shell: bash
        run: |
          set -euo pipefail
          docker build --platform linux/amd64 --progress plain \
            --label "org.opencontainers.image.revision=$SOURCE_COMMIT" \
            --label "rebu.source-archive.sha256=$SOURCE_SHA256" \
            --build-arg VITE_API_URL=https://api.rebugx.cn \
            --build-arg VITE_PUBLIC_H5_URL=https://gx.yrydai.com/h5/ \
            --build-arg VITE_PUBLIC_ASSET_ORIGIN=https://static.rebugx.cn \
            -f "$RUNNER_TEMP/rebu-image-source/docker/Dockerfile" \
            -t "$IMAGE_TAG" "$RUNNER_TEMP/rebu-image-source" 2>&1 | tee results/image-build.log

      - name: 验证运行包 Prisma、前端挂载及隔离启动
        timeout-minutes: 12
        run: node scripts/release/verify-linux-image-runtime.mjs

      - name: 保存本轮证据
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-image-verification-9695462de-${{ github.run_id }}
          path: results/
          retention-days: 14
          if-no-files-found: error



