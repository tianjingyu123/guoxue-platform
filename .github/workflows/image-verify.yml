name: 固定源码包 Linux 镜像隔离验证

on:
  push:
    branches: ["codex/image-verify-20260930"]
    paths:
      - ".github/workflows/image-verify.yml"
      - "scripts/release/verify-linux-image-runtime.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-verification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image-verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # GitHub 草稿附件仅对有推送权限的令牌可读；此任务只下载，不发布或推送镜像。
    permissions:
      contents: write
    env:
      SOURCE_COMMIT: "08a5c0acea4ddc28db05b4ec6f563573bb4475b9"
      SOURCE_SHA256: "4e4ea5a64177d6ec2ae6fd0f5e16afa36ad351bccda0ed7e774e566581266873"
      IMAGE_TAG: "rebu-linux-verify:08a5c0ac"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.18.0"

      - name: 下载并验真固定源码包
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results "$RUNNER_TEMP/rebu-image-source"
          archive="$RUNNER_TEMP/gx-deploy-91-launch-20260930-08a5c0ac.tar.gz"
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/octet-stream" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/tianjingyu123/guoxue-platform/releases/assets/600952497 \
            --output "$archive"
          printf '%s  %s\n' "$SOURCE_SHA256" "$archive" > "$archive.sha256"
          node scripts/release/verify-fixed-package.mjs "$archive" "$archive.sha256" \
            --expected-commit "$SOURCE_COMMIT" --report results/source-package.json
          tar -xzf "$archive" -C "$RUNNER_TEMP/rebu-image-source"

      - name: 使用正式 Dockerfile 构建 Linux 镜像
        timeout-minutes: 40
        shell: bash
        run: |
          set -euo pipefail
          docker build --platform linux/amd64 --progress plain \
            --label "org.opencontainers.image.revision=$SOURCE_COMMIT" \
            --label "rebu.source-archive.sha256=$SOURCE_SHA256" \
            --build-arg VITE_API_URL=https://api.rebugx.cn \
            --build-arg VITE_PUBLIC_H5_URL=https://gx.yrydai.com/h5/ \
            --build-arg VITE_PUBLIC_ASSET_ORIGIN=https://static.rebugx.cn \
            -f "$RUNNER_TEMP/rebu-image-source/docker/Dockerfile" \
            -t "$IMAGE_TAG" "$RUNNER_TEMP/rebu-image-source" 2>&1 | tee results/image-build.log

      - name: 验证运行包 Prisma、前端挂载及隔离启动
        timeout-minutes: 12
        run: node scripts/release/verify-linux-image-runtime.mjs

      - name: 保存本轮证据
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux-image-verification-08a5c0ac-${{ github.run_id }}
          path: results/
          retention-days: 14
          if-no-files-found: error
