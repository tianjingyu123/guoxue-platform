name: 全订单新事实与站内恢复隔离验证

on:
  push:
    branches: [codex/order-business-notice-verify-20261002]
    paths: [.github/workflows/order-business-notice-verify.yml, scripts/release/verify-isolated-order-business-notice.cjs]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.4-trixie@sha256:4cc13dede823cab4e05290c7fb3350fb4e599ecabd9b07e6706b5d5e8f5bc929
        env:
          POSTGRES_USER: qa_voice
          POSTGRES_PASSWORD: synthetic-test-only
          POSTGRES_DB: entitlement_notice_qa_order_base_135
        ports: ["55462:5432"]
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U qa_voice -d entitlement_notice_qa_order_base_135"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://qa_voice:synthetic-test-only@127.0.0.1:55462/entitlement_notice_qa_20261002_order_business
      ENTITLEMENT_NOTICE_TEST_DATABASE_URL: postgresql://qa_voice:synthetic-test-only@127.0.0.1:55462/entitlement_notice_qa_20261002_order_business
      SOURCE_COMMIT: feb4aeb5c3d9b60c790b73fe38d0e901984941f5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/order-business-notice-verify.yml
            /scripts/release/verify-isolated-order-business-notice.cjs
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          fetch-depth: 1
          path: candidate
          persist-credentials: true
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/.claude/
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: f2c7ccec4737e175a3df5550f5b1bc788ed1d2c7
          fetch-depth: 1
          path: baseline
          persist-credentials: true
          sparse-checkout: apps/server/prisma
      - name: 清除临时检出鉴权
        run: |
          git config --local --unset-all http.https://github.com/.extraheader || true
          git -C candidate config --local --unset-all http.https://github.com/.extraheader || true
          git -C baseline config --local --unset-all http.https://github.com/.extraheader || true
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.33.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: candidate/pnpm-lock.yaml
      - name: 固定身份、独立依赖与专用合成库
        working-directory: candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          mkdir -p artifacts/order-business-notice
          git rev-parse HEAD > artifacts/order-business-notice/source-binding.txt
          git ls-files apps/server/src apps/server/prisma/schema.prisma apps/server/prisma/migrations pnpm-lock.yaml | xargs sha256sum >> artifacts/order-business-notice/source-binding.txt
          pnpm install --frozen-lockfile
          pnpm --filter @guoxue/server exec prisma generate
          pnpm --filter @guoxue/shared build
          pnpm --filter @guoxue/bazi-engine build
          pnpm --filter @guoxue/ziwei-engine build
          # 先恢复前版135结构，再只应用新增08；这不是完整空库入口或正式迁移账本验收。
          test "$(git -C ../baseline rev-parse HEAD)" = "f2c7ccec4737e175a3df5550f5b1bc788ed1d2c7"
          DATABASE_URL=postgresql://qa_voice:synthetic-test-only@127.0.0.1:55462/entitlement_notice_qa_order_base_135 \
            pnpm --filter @guoxue/server exec prisma db push --schema "$GITHUB_WORKSPACE/baseline/apps/server/prisma/schema.prisma" --skip-generate
          export PGPASSWORD=synthetic-test-only
          createdb -h 127.0.0.1 -p 55462 -U qa_voice -T entitlement_notice_qa_order_base_135 entitlement_notice_qa_20261002_order_business
          psql -h 127.0.0.1 -p 55462 -U qa_voice -d entitlement_notice_qa_20261002_order_business -v ON_ERROR_STOP=1 \
            -f apps/server/prisma/migrations/20261002100008_order_business_notification_facts/migration.sql
          node -e 'const fs=require("fs"),assert=require("assert/strict"),p=require("path");let n=0;for(const d of fs.readdirSync("../baseline/apps/server/prisma/migrations",{withFileTypes:true}).filter(d=>d.isDirectory())){const f=p.join("apps/server/prisma/migrations",d.name,"migration.sql");assert(fs.readFileSync("../baseline/"+f).equals(fs.readFileSync(f)));n++}assert.equal(n,135);fs.writeFileSync("artifacts/order-business-notice/upgrade-binding.json",JSON.stringify({from:"f2c7ccec4737e175a3df5550f5b1bc788ed1d2c7",to:process.env.SOURCE_COMMIT,oldMigrationFilesUnchanged:n,newMigration:"20261002100008_order_business_notification_facts",schemaUpgradeOnly:true,production:false}))'
      - name: 新订单恢复及付款退款权益定向回归
        working-directory: candidate/apps/server
        run: |
          set -euo pipefail
          pnpm exec jest --runInBand --no-coverage --runTestsByPath src/modules/notification/order-business-notification.postgres.spec.ts src/modules/shop/shop-order-lifecycle.service.spec.ts src/modules/shop/refund-completion-boundary.postgres.spec.ts src/modules/shop/shop-refund.service.spec.ts src/modules/shop/shop-payment.service.spec.ts src/modules/shop/payment-ack-boundary.postgres.spec.ts src/modules/shop/school-member-entitlement.postgres.spec.ts src/modules/shop/practitioner-entitlement.postgres.spec.ts --json --outputFile ../../artifacts/order-business-notice/jest-results.json 2>&1 | tee ../../artifacts/order-business-notice/jest.log
          node -e 'const x=require("../../artifacts/order-business-notice/jest-results.json");if(x.numPassedTests!==226||x.numFailedTests||x.numPendingTests||x.numPassedTestSuites!==8)throw Error("定向数量或状态不符")'
          node -e 'require("fs").writeFileSync(".qa-refund-types.json",JSON.stringify({extends:"./tsconfig.jest.json",compilerOptions:{incremental:false},include:["src/types/express.d.ts","src/types/lunar-javascript.d.ts","src/types/sweph.d.ts","src/modules/shop/shop-refund.service.ts","src/modules/shop/shop-payment.service.ts","src/modules/notification/notification.module.ts","src/modules/notification/order-business-notification.task.ts","src/modules/notification/order-business-notification.postgres.spec.ts"],exclude:["node_modules","dist"]}))'
          cp .qa-refund-types.json ../../artifacts/order-business-notice/spec-types.json
          pnpm exec tsc --noEmit -p .qa-refund-types.json 2>&1 | tee ../../artifacts/order-business-notice/typecheck.log
          rm .qa-refund-types.json
          pnpm exec eslint src/modules/shop/shop-refund.service.ts src/modules/shop/shop-payment.service.ts src/modules/notification/notification.module.ts src/modules/notification/order-business-notification.task.ts src/modules/notification/order-business-notification.postgres.spec.ts --format json --output-file ../../artifacts/order-business-notice/lint.json
          pnpm build 2>&1 | tee ../../artifacts/order-business-notice/build.log
      - name: 编译服务真实数据库验证
        working-directory: candidate
        run: node ../scripts/release/verify-isolated-order-business-notice.cjs
      - name: 归档证据
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: order-business-notice-${{ env.SOURCE_COMMIT }}
          path: candidate/artifacts/order-business-notice/
          retention-days: 30
