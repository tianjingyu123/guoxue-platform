name: 圈帖打赏成交快照与删帖通知隔离验证

on:
  push:
    branches: [codex/circle-reward-lifecycle-verify-20261002]
    paths: [.github/workflows/circle-reward-lifecycle-verify.yml, scripts/release/verify-isolated-circle-reward-lifecycle.cjs]
  workflow_dispatch:
    inputs:
      source_commit:
        description: 已评审的完整候选提交
        required: true
        default: 2b108baf7e61d30ceb8136bc9af0206a7591c916

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_USER: qa_voice
          POSTGRES_PASSWORD: synthetic-test-only
          POSTGRES_DB: entitlement_notice_qa_circle_reward_lifecycle_linux
        ports: ["55462:5432"]
        options: >-
          --health-cmd "pg_isready -U qa_voice -d entitlement_notice_qa_circle_reward_lifecycle_linux"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://qa_voice:synthetic-test-only@127.0.0.1:55462/entitlement_notice_qa_circle_reward_lifecycle_linux
      ENTITLEMENT_NOTICE_TEST_DATABASE_URL: postgresql://qa_voice:synthetic-test-only@127.0.0.1:55462/entitlement_notice_qa_circle_reward_lifecycle_linux
      SOURCE_COMMIT: ${{ inputs.source_commit || '2b108baf7e61d30ceb8136bc9af0206a7591c916' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/circle-reward-lifecycle-verify.yml
            /scripts/release/verify-isolated-circle-reward-lifecycle.cjs
            /scripts/release/verify-isolated-circle-reward-upgrade.cjs
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          fetch-depth: 0
          path: candidate
          persist-credentials: true
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/.claude/
      - name: 清除临时只读检出鉴权
        run: |
          git config --local --unset-all http.https://github.com/.extraheader || true
          git -C candidate config --local --unset-all http.https://github.com/.extraheader || true
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.33.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: candidate/pnpm-lock.yaml
      - name: 固定身份、独立依赖与空合成库
        working-directory: candidate
        run: |
          set -euo pipefail
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          mkdir -p artifacts/circle-reward-lifecycle
          git rev-parse HEAD > artifacts/circle-reward-lifecycle/source-binding.txt
          git ls-files apps/server/src apps/server/prisma/schema.prisma apps/server/prisma/migrations pnpm-lock.yaml | xargs sha256sum >> artifacts/circle-reward-lifecycle/source-binding.txt
          pnpm install --frozen-lockfile
          pnpm --filter @guoxue/server exec prisma generate
          pnpm --filter @guoxue/shared build
          pnpm --filter @guoxue/bazi-engine build
          pnpm --filter @guoxue/ziwei-engine build
          git show e8319535f16429b70108f3ec46670f11016bb28e:apps/server/prisma/schema.prisma > apps/server/prisma/.qa-paid-course-parent.prisma
          pnpm --filter @guoxue/server exec prisma db push --skip-generate --schema prisma/.qa-paid-course-parent.prisma
          node ../scripts/release/verify-isolated-circle-reward-upgrade.cjs
          pnpm --filter @guoxue/server exec prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code > artifacts/circle-reward-lifecycle/schema-unchanged.log
          git ls-tree -r --name-only e8319535f16429b70108f3ec46670f11016bb28e apps/server/prisma/migrations | grep '/migration.sql$' | xargs git diff --exit-code e8319535f16429b70108f3ec46670f11016bb28e --
          rm apps/server/prisma/.qa-paid-course-parent.prisma
      - name: 指定付款退款与权益回归，不运行全仓
        working-directory: candidate/apps/server
        run: |
          set -euo pipefail
          pnpm exec jest --runInBand --no-coverage --runTestsByPath src/modules/coin/coin.service.spec.ts src/modules/circle/services/circle-member-removal.postgres.spec.ts src/modules/circle/services/circle-membership-count.postgres.spec.ts src/modules/circle/services/circle-post-read-boundary.spec.ts src/modules/circle/services/circle-post-reward-notification.task.spec.ts src/modules/circle/services/circle-post-reward-notification.postgres.spec.ts src/modules/notification/notification.service.spec.ts src/modules/circle/services/circle-post.service.spec.ts --json --outputFile ../../artifacts/circle-reward-lifecycle/jest-results.json 2>&1 | tee ../../artifacts/circle-reward-lifecycle/jest.log
          node -e 'const x=require("../../artifacts/circle-reward-lifecycle/jest-results.json");if(x.numPassedTests!==194||x.numFailedTests||x.numPendingTests||x.numPassedTestSuites!==8)throw Error("指定验证数量或状态不符")'
          node -e 'require("fs").writeFileSync(".qa-free-course-types.json",JSON.stringify({"extends":"./tsconfig.jest.json","compilerOptions":{"incremental":false},"include":["src/types/express.d.ts","src/types/lunar-javascript.d.ts","src/types/sweph.d.ts","src/modules/circle/services/circle-post.service.ts","src/modules/circle/services/circle-post.service.spec.ts","src/modules/circle/services/circle-post-reward-notification.postgres.spec.ts"],"exclude":["node_modules","dist"]}))'
          cp .qa-free-course-types.json ../../artifacts/circle-reward-lifecycle/spec-types.json
          pnpm exec tsc --noEmit -p .qa-free-course-types.json 2>&1 | tee ../../artifacts/circle-reward-lifecycle/typecheck.log
          rm .qa-free-course-types.json
          pnpm exec eslint src/modules/circle/services/circle-post-reward-notification.task.ts src/modules/circle/services/circle-post.service.ts src/modules/circle/services/circle-post.service.spec.ts src/modules/circle/services/circle-post-reward-notification.postgres.spec.ts --format json --output-file ../../artifacts/circle-reward-lifecycle/lint.json
          pnpm build 2>&1 | tee ../../artifacts/circle-reward-lifecycle/build.log
      - name: 编译产物真实事务验证
        working-directory: candidate
        run: node ../scripts/release/verify-isolated-circle-reward-lifecycle.cjs
      - name: 归档证据
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: circle-reward-lifecycle-${{ env.SOURCE_COMMIT }}
          path: candidate/artifacts/circle-reward-lifecycle/
          retention-days: 30




