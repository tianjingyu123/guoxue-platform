name: Deploy

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      environment:
        description: "部署目标环境"
        required: true
        type: choice
        options:
          - staging
          - production
      service:
        description: "部署服务"
        required: true
        default: "server"
        type: choice
        options:
          - server
          - admin
      image_tag:
        description: "Docker 镜像标签（留空则用 git SHA）"
        required: false
        type: string
      run_migration:
        description: "执行数据库迁移"
        required: false
        default: true
        type: boolean

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "10"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ──────────────────────────────────────────────
  # 构建并推送 Docker 镜像
  # ──────────────────────────────────────────────
  build-and-push:
    name: 构建 & 推送镜像
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
      actions: write
    outputs:
      image-tags: ${{ steps.meta.outputs.tags }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: 登录 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 提取镜像元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 构建 & 推送镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────────────────────────
  # 部署到 Staging
  # ──────────────────────────────────────────────
  deploy-staging:
    name: 部署到 Staging
    needs: build-and-push
    if: |
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) ||
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: staging
      url: https://staging.guoxue.ac.cn
    steps:
      - name: SSH 部署
        id: deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_HOST }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            set -e
            TAG="${{ needs.build-and-push.outputs.version || github.sha }}"

            # 拉取镜像
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u "${{ github.actor }}" --password-stdin
            docker pull ${{ needs.build-and-push.outputs.image-tags }}

            # 备份旧容器
            if docker ps -q --filter "name=guoxue-server" | grep -q .; then
              OLD_IMAGE=$(docker inspect --format='{{.Config.Image}}' guoxue-server)
              echo "OLD_IMAGE=$OLD_IMAGE" > /tmp/deploy-backup.env
            fi

            # 数据库迁移
            if [ "${{ inputs.run_migration }}" != "false" ]; then
              docker run --rm \
                --network guoxue-net \
                -e DATABASE_URL="${{ secrets.DATABASE_URL }}" \
                ${{ needs.build-and-push.outputs.image-tags }} \
                npx prisma migrate deploy --schema=apps/server/prisma/schema.prisma
            fi

            # 更新容器
            ENV_FILE="/opt/guoxue/.env.staging"
            docker rm -f guoxue-server-old 2>/dev/null || true
            docker rename guoxue-server guoxue-server-old 2>/dev/null || true

            docker run -d \
              --name guoxue-server \
              --restart unless-stopped \
              --network guoxue-net \
              -p 3000:3000 \
              --env-file "$ENV_FILE" \
              ${{ needs.build-and-push.outputs.image-tags }}

            # 健康检查
            for i in $(seq 1 15); do
              sleep 2
              if curl -sf http://localhost:3000/api/v1/health > /dev/null 2>&1; then
                echo "✅ Staging 健康检查通过"
                docker rm -f guoxue-server-old 2>/dev/null || true
                exit 0
              fi
            done

            # 回滚
            echo "❌ 健康检查失败，回滚..."
            docker rm -f guoxue-server
            docker rename guoxue-server-old guoxue-server 2>/dev/null || true
            exit 1

  # ──────────────────────────────────────────────
  # 部署到 Production
  # ──────────────────────────────────────────────
  deploy-production:
    name: 部署到 Production
    needs: build-and-push
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'production')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://guoxue.ac.cn
    steps:
      - name: SSH 部署
        id: deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_HOST }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            set -e
            TAG="${{ needs.build-and-push.outputs.version || github.ref_name }}"
            echo "[deploy] 生产部署 — 版本: $TAG"

            # 登录 GHCR
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u "${{ github.actor }}" --password-stdin

            # 拉取镜像
            docker pull ${{ needs.build-and-push.outputs.image-tags }}

            # 备份旧容器
            if docker ps -q --filter "name=guoxue-server" | grep -q .; then
              OLD_IMAGE=$(docker inspect --format='{{.Config.Image}}' guoxue-server)
              echo "OLD_IMAGE=$OLD_IMAGE" > /tmp/deploy-backup.env
            fi

            # 数据库备份
            echo "[deploy] 数据库备份..."
            /opt/guoxue/docker/pg-backup.sh 30

            # 数据库迁移
            if [ "${{ inputs.run_migration }}" != "false" ]; then
              echo "[deploy] 执行数据库迁移..."
              docker run --rm \
                --network guoxue-net \
                -e DATABASE_URL="${{ secrets.DATABASE_URL }}" \
                ${{ needs.build-and-push.outputs.image-tags }} \
                npx prisma migrate deploy --schema=apps/server/prisma/schema.prisma
            fi

            # 零停机滚动更新
            echo "[deploy] 滚动更新..."
            docker rm -f guoxue-server-old 2>/dev/null || true
            docker rename guoxue-server guoxue-server-old 2>/dev/null || true

            ENV_FILE="/opt/guoxue/.env.production"
            docker run -d \
              --name guoxue-server \
              --restart unless-stopped \
              --network guoxue-net \
              -p 3000:3000 \
              --env-file "$ENV_FILE" \
              --memory 512M \
              --memory-reservation 256M \
              --cap-drop ALL \
              --cap-add NET_BIND_SERVICE \
              ${{ needs.build-and-push.outputs.image-tags }}

            # 健康检查 (最长 90s)
            echo "[deploy] 健康检查..."
            for i in $(seq 1 30); do
              sleep 3
              if curl -sf http://localhost:3000/api/v1/health > /dev/null 2>&1; then
                echo "✅ 生产部署成功 — $TAG"
                docker rm -f guoxue-server-old 2>/dev/null || true
                docker image prune -f --filter "until=72h"
                exit 0
              fi
            done

            # 自动回滚
            echo "❌ 健康检查超时 — 自动回滚..."
            docker rm -f guoxue-server
            docker rename guoxue-server-old guoxue-server 2>/dev/null || true
            exit 1

  # ──────────────────────────────────────────────
  # 部署通知
  # ──────────────────────────────────────────────
  notify:
    name: 部署结果通知
    needs: [deploy-staging, deploy-production]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: 企业微信通知
        if: env.WEWORK_WEBHOOK_URL != ''
        env:
          STAGING_RESULT: ${{ needs.deploy-staging.result }}
          PROD_RESULT: ${{ needs.deploy-production.result }}
        run: |
          if [ "$STAGING_RESULT" = "success" ] || [ "$PROD_RESULT" = "success" ]; then
            ENV_LABEL="$([ "$PROD_RESULT" = "success" ] && echo "生产环境" || echo "预发布环境")"
            STATUS="✅ 部署成功"
          elif [ "$STAGING_RESULT" = "failure" ] || [ "$PROD_RESULT" = "failure" ]; then
            ENV_LABEL="$([ "$PROD_RESULT" = "failure" ] && echo "生产环境" || echo "预发布环境")"
            STATUS="❌ 部署失败（已自动回滚）"
          else
            ENV_LABEL="—"
            STATUS="⏭️ 跳过"
          fi

          curl -s -X POST "${{ secrets.WEWORK_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"msgtype\": \"markdown\",
              \"markdown\": {
                \"content\": \"## 国学平台部署通知\n> 环境: **${ENV_LABEL}**\n> 版本: \`${{ github.ref_name }}\`\n> 状态: ${STATUS}\n> 提交: ${{ github.event.head_commit.message }}\"
              }
            }" || true
