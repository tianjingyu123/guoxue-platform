name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: '部署环境'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      service:
        description: '部署服务'
        required: true
        default: 'server'
        type: choice
        options:
          - server
          - admin
      image_tag:
        description: 'Docker 镜像标签（默认为 git commit SHA）'
        required: false
        type: string

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '10'
  # ─── 镜像仓库配置（通过 GitHub Secrets 注入）───
  # 腾讯云 TCR:    REGISTRY=ccr.ccs.tencentyun.com/your-namespace
  # Docker Hub:    REGISTRY=docker.io/your-username
  REGISTRY: ${{ secrets.REGISTRY || 'docker.io/guoxue' }}
  IMAGE_NAME: guoxue-${{ github.event.inputs.service }}
  IMAGE_TAG: ${{ github.event.inputs.image_tag || github.sha }}

jobs:
  build-and-push:
    name: 构建并推送镜像
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: 安装依赖
        run: pnpm install --frozen-lockfile
        timeout-minutes: 10

      - name: 构建服务
        run: pnpm build:${{ github.event.inputs.service }}
        timeout-minutes: 10

      - name: 登录容器镜像仓库
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 构建并推送 Docker 镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
        timeout-minutes: 15

  deploy:
    name: 部署到服务器
    runs-on: ubuntu-latest
    needs: build-and-push
    timeout-minutes: 20
    environment: ${{ github.event.inputs.environment }}
    steps:
      - name: 通过 SSH 部署
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e

            # 登录镜像仓库
            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login ${{ env.REGISTRY }} -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

            # 拉取新镜像
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

            # 停止旧容器
            docker rm -f guoxue-${{ github.event.inputs.service }} || true

            # 启动新容器
            docker run -d \
              --name guoxue-${{ github.event.inputs.service }} \
              --restart unless-stopped \
              -p ${{ secrets.APP_PORT || '3000' }}:3000 \
              -e DATABASE_URL="${{ secrets.DATABASE_URL }}" \
              -e JWT_SECRET="${{ secrets.JWT_SECRET }}" \
              -e NODE_ENV=${{ github.event.inputs.environment }} \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

            # 清理旧镜像
            docker image prune -f --filter "until=24h"
