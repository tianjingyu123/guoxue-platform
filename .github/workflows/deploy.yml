name: Deploy

# 迁移期间禁止 push/tag 自动触碰任何服务器。生产发布只能手动发起，且必须通过
# production Environment 审批、新基础设施就绪开关和发布标识同值确认。
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "部署目标环境"
        required: true
        type: choice
        options:
          - staging
          - production
      release_id:
        description: "固定发布标识（8-80 位字母、数字、点、下划线或短横线）"
        required: true
        type: string
      production_confirmation:
        description: "生产环境必须再次输入完全相同的发布标识"
        required: false
        type: string
      run_migration:
        description: "执行已审查的数据库迁移（默认关闭）"
        required: false
        default: false
        type: boolean
      migration_confirmation:
        description: "仅执行生产迁移时填写 migrate:<release_id>"
        required: false
        type: string

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "10.33.3"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  gate-production:
    name: 生产确认、代码门禁与正式配置客户端成品
    if: inputs.environment == 'production'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: 验证默认分支、新基础设施与人工确认
        env:
          RELEASE_ID: ${{ inputs.release_id }}
          PRODUCTION_CONFIRMATION: ${{ inputs.production_confirmation }}
          RUN_MIGRATION: ${{ inputs.run_migration }}
          MIGRATION_CONFIRMATION: ${{ inputs.migration_confirmation }}
          PRODUCTION_DEPLOY_READY: ${{ vars.PRODUCTION_DEPLOY_READY }}
          PRODUCTION_DEPLOY_TARGET: ${{ vars.PRODUCTION_DEPLOY_TARGET }}
          PROD_NODE_A_CONFIGURED: ${{ secrets.PROD_HOST_A != '' && secrets.PROD_SSH_FINGERPRINT_A != '' }}
          PROD_NODE_B_CONFIGURED: ${{ secrets.PROD_HOST_B != '' && secrets.PROD_SSH_FINGERPRINT_B != '' }}
          SOURCE_REF: ${{ github.ref }}
          SOURCE_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: node scripts/release/validate-production-dispatch.mjs

      - name: 安装锁定依赖
        run: pnpm install --frozen-lockfile

      - name: 执行代码审计、测试、服务端与五端构建
        run: pnpm release:verify:local

      - name: 使用正式公开配置重建并审计各端成品
        env:
          RELEASE_ID: ${{ inputs.release_id }}
          SOURCE_COMMIT: ${{ github.sha }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_PUBLIC_H5_URL: ${{ vars.VITE_PUBLIC_H5_URL }}
          VITE_PUBLIC_ASSET_ORIGIN: ${{ vars.VITE_PUBLIC_ASSET_ORIGIN }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p release-evidence
          CLIENT_ENV=release-evidence/production-client.env
          printf 'VITE_API_URL=%s\n' "$VITE_API_URL" > "$CLIENT_ENV"
          printf 'VITE_PUBLIC_H5_URL=%s\n' "$VITE_PUBLIC_H5_URL" >> "$CLIENT_ENV"
          printf 'VITE_PUBLIC_ASSET_ORIGIN=%s\n' "$VITE_PUBLIC_ASSET_ORIGIN" >> "$CLIENT_ENV"
          node scripts/release/build-clients-with-env.mjs "$CLIENT_ENV"
          node scripts/release/audit-client-artifacts.mjs "$CLIENT_ENV" \
            --release-id "$RELEASE_ID" \
            --source-commit "$SOURCE_COMMIT" \
            --report release-evidence/client-artifact-audit.json
          node scripts/release/verify-client-artifacts.mjs \
            release-evidence/client-artifact-audit.json \
            --expected-release-id "$RELEASE_ID" \
            --expected-commit "$SOURCE_COMMIT" \
            --output release-evidence/client-artifact-verification.json
          node scripts/release/create-client-config-binding.mjs "$CLIENT_ENV" \
            --release-id "$RELEASE_ID" \
            --source-commit "$SOURCE_COMMIT" \
            --output release-evidence/client-config-binding.json
          rm -f "$CLIENT_ENV"

      - name: 保存正式配置客户端成品与审计证据
        uses: actions/upload-artifact@v4
        with:
          name: production-clients-${{ inputs.release_id }}
          path: |
            apps/admin/dist
            apps/mobile/dist/build/h5
            apps/mobile/dist/build/mp-weixin
            apps/mobile/dist/build/app
            apps/mobile/dist/build/app-harmony
            release-evidence/client-artifact-audit.json
            release-evidence/client-artifact-verification.json
            release-evidence/client-config-binding.json
          if-no-files-found: error
          retention-days: 14

      - name: 保存固定包所需的客户端配置证据
        uses: actions/upload-artifact@v4
        with:
          name: production-client-evidence-${{ inputs.release_id }}
          path: |
            release-evidence/client-artifact-audit.json
            release-evidence/client-artifact-verification.json
            release-evidence/client-config-binding.json
          if-no-files-found: error
          retention-days: 14

  package-production:
    name: 生成并验真固定发布包
    if: inputs.environment == 'production'
    needs: gate-production
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/download-artifact@v4
        with:
          name: production-client-evidence-${{ inputs.release_id }}
          path: artifacts/client-evidence

      - name: 生成打包工作树冻结证据
        run: |
          node scripts/release/audit-source-freeze.mjs --strict \
            --expected-branch "${{ github.event.repository.default_branch }}" \
            --expected-commit "${{ github.sha }}" \
            --report artifacts/client-evidence/source-freeze-readiness.json

      - name: 生成固定发布包
        env:
          RELEASE_ID: ${{ inputs.release_id }}
        run: |
          node scripts/release/create-fixed-package.mjs "$RELEASE_ID" \
            --client-config-binding artifacts/client-evidence/client-config-binding.json \
            --client-artifact-audit artifacts/client-evidence/client-artifact-audit.json \
            --client-artifact-verification artifacts/client-evidence/client-artifact-verification.json \
            --source-freeze-audit artifacts/client-evidence/source-freeze-readiness.json

      - name: 上传前逐文件验真
        env:
          RELEASE_ID: ${{ inputs.release_id }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          mkdir -p release-evidence
          node scripts/release/verify-fixed-package.mjs \
            "artifacts/releases/gx-deploy-91-$RELEASE_ID.tar.gz" \
            "artifacts/releases/gx-deploy-91-$RELEASE_ID.tar.gz.sha256" \
            --expected-commit "$SOURCE_COMMIT" \
            --report release-evidence/package-verification.json

      - name: 保存发布包与验真证据
        uses: actions/upload-artifact@v4
        with:
          name: fixed-release-${{ inputs.release_id }}
          path: |
            artifacts/releases/gx-deploy-91-${{ inputs.release_id }}.tar.gz
            artifacts/releases/gx-deploy-91-${{ inputs.release_id }}.tar.gz.sha256
            release-evidence/package-verification.json
          if-no-files-found: error
          retention-days: 14

  deploy-production:
    name: 固定包双节点滚动部署
    if: inputs.environment == 'production'
    needs: package-production
    runs-on: ubuntu-latest
    timeout-minutes: 80
    environment:
      name: production
      url: ${{ vars.PUBLIC_H5_URL }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/download-artifact@v4
        with:
          name: fixed-release-${{ inputs.release_id }}
          path: release-input

      - name: 汇总待上传文件
        run: cp scripts/release/activate-fixed-release.sh release-input/activate-fixed-release.sh

      - name: 准备业务节点 A 接收目录
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.PROD_HOST_A }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          fingerprint: ${{ secrets.PROD_SSH_FINGERPRINT_A }}
          script: |
            set -euo pipefail
            install -d -m 0750 /opt/guoxue/incoming /opt/guoxue/releases /opt/guoxue/release-evidence
            test -f /opt/guoxue/shared/.env.production
            MODE="$(stat -c '%a' /opt/guoxue/shared/.env.production)"
            [ "$MODE" = "600" ] || [ "$MODE" = "400" ]

      - name: 上传固定包到业务节点 A
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634
        with:
          host: ${{ secrets.PROD_HOST_A }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          fingerprint: ${{ secrets.PROD_SSH_FINGERPRINT_A }}
          source: "release-input/gx-deploy-91-${{ inputs.release_id }}.tar.gz,release-input/gx-deploy-91-${{ inputs.release_id }}.tar.gz.sha256,release-input/activate-fixed-release.sh"
          target: "/opt/guoxue/incoming/"
          strip_components: 1
          overwrite: true

      - name: 业务节点 A 二次验真并激活
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.PROD_HOST_A }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          fingerprint: ${{ secrets.PROD_SSH_FINGERPRINT_A }}
          command_timeout: 40m
          script: |
            set -euo pipefail
            RELEASE_ID='${{ inputs.release_id }}'
            ARCHIVE="/opt/guoxue/incoming/gx-deploy-91-$RELEASE_ID.tar.gz"
            CHECKSUM="$ARCHIVE.sha256"
            test -f "$ARCHIVE" && test -f "$CHECKSUM"
            ROOT_DIR=/opt/guoxue \
            ENV_FILE=/opt/guoxue/shared/.env.production \
            EXPECTED_RELEASE_ID="$RELEASE_ID" \
            EXPECTED_COMMIT='${{ github.sha }}' \
            DEPLOY_TARGET='${{ vars.PRODUCTION_DEPLOY_TARGET }}' \
            NODE_ROLE=app \
            COMPOSE_PROJECT_NAME=guoxue \
            RUN_MIGRATION='${{ inputs.run_migration }}' \
            MIGRATION_DEPLOY_CONFIRM='${{ inputs.migration_confirmation }}' \
              bash /opt/guoxue/incoming/activate-fixed-release.sh "$ARCHIVE" "$CHECKSUM"

      - name: 确认节点 A 激活后 CLB 持续可用
        env:
          PUBLIC_H5_URL: ${{ vars.PUBLIC_H5_URL }}
        run: |
          set -euo pipefail
          export BASE_URL="$(node -e 'process.stdout.write(new URL(process.env.PUBLIC_H5_URL).origin)')"
          bash scripts/operations/probe-clb-failover.sh 30

      - name: 准备运维节点 B 接收目录
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.PROD_HOST_B }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          fingerprint: ${{ secrets.PROD_SSH_FINGERPRINT_B }}
          script: |
            set -euo pipefail
            install -d -m 0750 /opt/guoxue/incoming /opt/guoxue/releases /opt/guoxue/release-evidence
            test -f /opt/guoxue/shared/.env.production
            MODE="$(stat -c '%a' /opt/guoxue/shared/.env.production)"
            [ "$MODE" = "600" ] || [ "$MODE" = "400" ]

      - name: 上传固定包到运维节点 B
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634
        with:
          host: ${{ secrets.PROD_HOST_B }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          fingerprint: ${{ secrets.PROD_SSH_FINGERPRINT_B }}
          source: "release-input/gx-deploy-91-${{ inputs.release_id }}.tar.gz,release-input/gx-deploy-91-${{ inputs.release_id }}.tar.gz.sha256,release-input/activate-fixed-release.sh"
          target: "/opt/guoxue/incoming/"
          strip_components: 1
          overwrite: true

      - name: 运维节点 B 二次验真并激活
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.PROD_HOST_B }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          fingerprint: ${{ secrets.PROD_SSH_FINGERPRINT_B }}
          command_timeout: 40m
          script: |
            set -euo pipefail
            RELEASE_ID='${{ inputs.release_id }}'
            ARCHIVE="/opt/guoxue/incoming/gx-deploy-91-$RELEASE_ID.tar.gz"
            CHECKSUM="$ARCHIVE.sha256"
            test -f "$ARCHIVE" && test -f "$CHECKSUM"
            ROOT_DIR=/opt/guoxue \
            ENV_FILE=/opt/guoxue/shared/.env.production \
            EXPECTED_RELEASE_ID="$RELEASE_ID" \
            EXPECTED_COMMIT='${{ github.sha }}' \
            DEPLOY_TARGET='${{ vars.PRODUCTION_DEPLOY_TARGET }}' \
            NODE_ROLE=operations \
            COMPOSE_PROJECT_NAME=guoxue \
            RUN_MIGRATION=false \
            MIGRATION_DEPLOY_CONFIRM='' \
              bash /opt/guoxue/incoming/activate-fixed-release.sh "$ARCHIVE" "$CHECKSUM"

      - name: 确认双节点激活后 CLB 持续可用
        env:
          PUBLIC_H5_URL: ${{ vars.PUBLIC_H5_URL }}
        run: |
          set -euo pipefail
          export BASE_URL="$(node -e 'process.stdout.write(new URL(process.env.PUBLIC_H5_URL).origin)')"
          bash scripts/operations/probe-clb-failover.sh 45

  build-staging-image:
    name: 构建 Staging 镜像
    if: inputs.environment == 'staging'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: staging
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: type=raw,value=${{ inputs.release_id }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL }}
            VITE_PUBLIC_H5_URL=${{ vars.VITE_PUBLIC_H5_URL }}
            VITE_PUBLIC_ASSET_ORIGIN=${{ vars.VITE_PUBLIC_ASSET_ORIGIN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: 部署到 Staging
    if: inputs.environment == 'staging'
    needs: build-staging-image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: staging
      url: ${{ vars.PUBLIC_H5_URL }}
    permissions:
      contents: read
      packages: read
    steps:
      - name: 校验 Staging SSH 主机指纹
        env:
          STAGING_SSH_FINGERPRINT: ${{ secrets.STAGING_SSH_FINGERPRINT }}
        run: test -n "$STAGING_SSH_FINGERPRINT"

      - name: 拉取镜像并健康切换
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.STAGING_HOST }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          fingerprint: ${{ secrets.STAGING_SSH_FINGERPRINT }}
          script: |
            set -euo pipefail
            IMAGE='${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.release_id }}'
            ENV_FILE=/opt/guoxue/.env.staging
            test -f "$ENV_FILE"
            echo '${{ secrets.GITHUB_TOKEN }}' | docker login '${{ env.REGISTRY }}' \
              -u '${{ github.actor }}' --password-stdin
            docker pull "$IMAGE"
            docker rm -f guoxue-server-old 2>/dev/null || true
            if docker inspect guoxue-server >/dev/null 2>&1; then
              docker stop guoxue-server
              docker rename guoxue-server guoxue-server-old
            fi
            docker run -d --name guoxue-server --restart unless-stopped \
              --network host --env-file "$ENV_FILE" "$IMAGE"
            for attempt in $(seq 1 30); do
              sleep 3
              curl -sf http://127.0.0.1:3000/api/v1/health/ready >/dev/null && {
                docker rm -f guoxue-server-old 2>/dev/null || true
                exit 0
              }
              [ "$attempt" -lt 30 ] || {
                docker rm -f guoxue-server
                docker rename guoxue-server-old guoxue-server 2>/dev/null || true
                docker start guoxue-server 2>/dev/null || true
                exit 1
              }
            done

  notify:
    name: 部署结果
    if: always()
    needs: [deploy-production, deploy-staging]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: 输出结果（不回显任何凭据）
        run: |
          echo "目标环境：${{ inputs.environment }}"
          echo "发布标识：${{ inputs.release_id }}"
          echo "生产结果：${{ needs.deploy-production.result }}"
          echo "预发布结果：${{ needs.deploy-staging.result }}"
