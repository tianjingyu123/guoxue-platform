name: Deploy

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      environment:
        description: "部署目标环境"
        required: true
        type: choice
        options:
          - staging
          - production
      service:
        description: "部署服务"
        required: true
        default: "server"
        type: choice
        options:
          - server
          - frontend
          - admin
          - all
      image_tag:
        description: "Docker 镜像标签（留空则用 git SHA）"
        required: false
        type: string
      run_migration:
        description: "执行数据库迁移"
        required: false
        default: true
        type: boolean

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "10"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ──────────────────────────────────────────────
  # 构建并推送 Docker 镜像
  # ──────────────────────────────────────────────
  build-and-push:
    name: 构建 & 推送镜像
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
      actions: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: 登录 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 提取镜像元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 构建 & 推送镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          no-cache: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────────────────────────
  # 部署到 Staging
  # ──────────────────────────────────────────────
  deploy-staging:
    name: 部署到 Staging
    needs: build-and-push
    continue-on-error: true
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'staging'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: staging
      url: https://staging.guoxue.ac.cn
    steps:
      - name: SSH 部署
        id: deploy
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.STAGING_HOST }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            set -e
            TAG="${{ needs.build-and-push.outputs.version || github.sha }}"
            IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$TAG"

            # 拉取镜像
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u "${{ github.actor }}" --password-stdin
            docker pull "$IMAGE"

            # 备份旧容器
            if docker ps -q --filter "name=guoxue-server" | grep -q .; then
              OLD_IMAGE=$(docker inspect --format='{{.Config.Image}}' guoxue-server)
              echo "OLD_IMAGE=$OLD_IMAGE" > /tmp/deploy-backup.env
            fi

            # 数据库迁移（host网络模式：PostgreSQL在宿主机监听localhost）
            if [ "${{ inputs.run_migration }}" != "false" ]; then
              docker run --rm \
                --network host \
                -e DATABASE_URL="${{ secrets.DATABASE_URL }}" \
                "$IMAGE" \
                npx prisma migrate deploy --schema=apps/server/prisma/schema.prisma
            fi

            # 更新容器
            ENV_FILE="/opt/guoxue/.env.staging"
            docker rm -f guoxue-server-old 2>/dev/null || true
            docker rename guoxue-server guoxue-server-old 2>/dev/null || true

            docker run -d \
              --name guoxue-server \
              --restart unless-stopped \
              --network host \
              --env-file "$ENV_FILE" \
              "$IMAGE"

            # 健康检查
            for i in $(seq 1 15); do
              sleep 2
              if curl -sf http://localhost:3000/api/v1/health > /dev/null 2>&1; then
                echo "✅ Staging 健康检查通过"
                docker rm -f guoxue-server-old 2>/dev/null || true
                exit 0
              fi
            done

            # 回滚
            echo "❌ 健康检查失败，回滚..."
            docker rm -f guoxue-server
            docker rename guoxue-server-old guoxue-server 2>/dev/null || true
            exit 1

  # ──────────────────────────────────────────────
  # 部署到 Production
  # ──────────────────────────────────────────────
  deploy-production:
    name: 部署到 Production
    needs: build-and-push
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'production')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://guoxue.ac.cn
    steps:
      - name: SSH 部署
        id: deploy
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.PROD_HOST }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            set -e
            TAG="${{ needs.build-and-push.outputs.version || github.ref_name }}"
            IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$TAG"
            echo "[deploy] 生产部署 — 版本: $TAG"

            # 登录 GHCR
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u "${{ github.actor }}" --password-stdin

            # 拉取镜像
            docker pull "$IMAGE"

            # 备份旧容器
            if docker ps -q --filter "name=guoxue-server" | grep -q .; then
              OLD_IMAGE=$(docker inspect --format='{{.Config.Image}}' guoxue-server)
              echo "OLD_IMAGE=$OLD_IMAGE" > /tmp/deploy-backup.env
            fi

            # 数据库备份
            echo "[deploy] 数据库备份..."
            /opt/guoxue/docker/pg-backup.sh 30

            # 数据库迁移
            if [ "${{ inputs.run_migration }}" != "false" ]; then
              echo "[deploy] 执行数据库迁移..."
              docker run --rm \
                --network guoxue-net \
                -e DATABASE_URL="${{ secrets.DATABASE_URL }}" \
                "$IMAGE" \
                npx prisma migrate deploy --schema=apps/server/prisma/schema.prisma
            fi

            # 零停机滚动更新
            echo "[deploy] 滚动更新..."
            docker rm -f guoxue-server-old 2>/dev/null || true
            docker rename guoxue-server guoxue-server-old 2>/dev/null || true

            ENV_FILE="/opt/guoxue/.env.production"
            docker run -d \
              --name guoxue-server \
              --restart unless-stopped \
              --network host \
              --env-file "$ENV_FILE" \
              --memory 512M \
              --memory-reservation 256M \
              --cap-drop ALL \
              --cap-add NET_BIND_SERVICE \
              "$IMAGE"

            # 健康检查 (最长 90s)
            echo "[deploy] 健康检查..."
            for i in $(seq 1 30); do
              sleep 3
              if curl -sf http://localhost:3000/api/v1/health > /dev/null 2>&1; then
                echo "✅ 生产部署成功 — $TAG"
                docker rm -f guoxue-server-old 2>/dev/null || true
                docker image prune -f --filter "until=72h"
                exit 0
              fi
            done

            # 自动回滚
            echo "❌ 健康检查超时 — 自动回滚..."
            docker rm -f guoxue-server
            docker rename guoxue-server-old guoxue-server 2>/dev/null || true
            exit 1

  # ──────────────────────────────────────────────
  # 前端静态文件部署（自托管）
  # ──────────────────────────────────────────────
  deploy-frontend:
    name: 部署前端静态文件
    # 仅手动触发：push 触发已移除——GitHub runner 到国内服务器网络不通必失败刷邮件；
    # 且真实部署走 bundle+scp 流程（见 docs/knowledge/项目Prompt知识库.md §四），双通道会互相覆盖。
    if: |
      github.event_name == 'workflow_dispatch' && (inputs.service == 'frontend' || inputs.service == 'all')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build 移动端 H5
        working-directory: apps/mobile
        run: pnpm build:h5
        env:
          VITE_API_URL: 'https://api.rebugx.cn'
          VITE_USE_MOCK: 'false'

      - name: Build 管理后台
        working-directory: apps/admin
        run: pnpm build
        env:
          VITE_API_URL: 'https://api.rebugx.cn'

      - name: 部署到服务器
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.PROD_HOST }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            FRONTEND_BASE="/opt/guoxue/frontend"
            mkdir -p "$FRONTEND_BASE"/{mobile,admin}

      - name: 上传移动端
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634
        with:
          host: ${{ secrets.PROD_HOST }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          source: 'dist/build/h5/*'
          target: '/opt/guoxue/frontend/mobile/'
          strip_components: 3
          rm: true

      - name: 上传管理后台
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634
        with:
          host: ${{ secrets.PROD_HOST }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          source: 'dist/*'
          target: '/opt/guoxue/frontend/admin/'
          strip_components: 1
          rm: true

      - name: 配置 Nginx + 重载
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.PROD_HOST }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            # 首次部署时拷贝 nginx 配置并启用
            if [ ! -f /etc/nginx/sites-enabled/guoxue-frontend ]; then
              cp /opt/guoxue/guoxue-platform/docker/nginx-frontend.conf /etc/nginx/sites-available/guoxue-frontend
              ln -s /etc/nginx/sites-available/guoxue-frontend /etc/nginx/sites-enabled/guoxue-frontend
            fi
            nginx -t && systemctl reload nginx
            echo "✅ 前端部署完成"

  # ──────────────────────────────────────────────
  # 部署通知
  # ──────────────────────────────────────────────
  notify:
    name: 部署结果通知
    needs: [deploy-staging, deploy-production, deploy-frontend]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: 企业微信通知
        if: env.WEWORK_WEBHOOK_URL != ''
        env:
          STAGING_RESULT: ${{ needs.deploy-staging.result }}
          PROD_RESULT: ${{ needs.deploy-production.result }}
        run: |
          if [ "$PROD_RESULT" = "success" ]; then
            ENV_LABEL="生产环境"
            STATUS="✅ 部署成功"
          elif [ "$STAGING_RESULT" = "success" ]; then
            ENV_LABEL="预发布环境"
            STATUS="✅ 部署成功"
          elif [ "$PROD_RESULT" = "failure" ]; then
            ENV_LABEL="生产环境"
            STATUS="❌ 部署失败（已自动回滚）"
          elif [ "$STAGING_RESULT" = "failure" ]; then
            ENV_LABEL="预发布环境"
            STATUS="⚠️ Staging 不可达，已跳过（检查服务器/SSH密钥）"
          else
            ENV_LABEL="—"
            STATUS="⏭️ 跳过"
          fi

          curl -s -X POST "${{ secrets.WEWORK_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"msgtype\": \"markdown\",
              \"markdown\": {
                \"content\": \"## 国学平台部署通知\n> 环境: **${ENV_LABEL}**\n> 版本: \`${{ github.ref_name }}\`\n> 状态: ${STATUS}\n> 提交: ${{ github.event.head_commit.message }}\"
              }
            }" || true
