name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: '部署环境'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      service:
        description: '部署服务'
        required: true
        default: 'server'
        type: choice
        options:
          - server
          - admin
      image_tag:
        description: 'Docker 镜像标签（默认为 git commit SHA）'
        required: false
        type: string
      run_migration:
        description: '是否执行数据库迁移'
        required: false
        default: true
        type: boolean

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '10'
  REGISTRY: ${{ secrets.REGISTRY || 'docker.io/guoxue' }}
  IMAGE_NAME: guoxue-${{ github.event.inputs.service }}
  IMAGE_TAG: ${{ github.event.inputs.image_tag || github.sha }}
  CONTAINER_NAME: guoxue-${{ github.event.inputs.service }}

jobs:
  build-and-push:
    name: 构建并推送镜像
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: 安装依赖
        run: pnpm install --frozen-lockfile
        timeout-minutes: 10

      - name: 构建服务
        run: pnpm build:${{ github.event.inputs.service }}
        timeout-minutes: 10

      - name: 登录容器镜像仓库
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 构建并推送 Docker 镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
        timeout-minutes: 15

  deploy:
    name: 部署到服务器
    runs-on: ubuntu-latest
    needs: build-and-push
    timeout-minutes: 20
    environment: ${{ github.event.inputs.environment }}
    steps:
      - name: 通过 SSH 部署
        id: deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e

            # 登录镜像仓库
            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login ${{ env.REGISTRY }} -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

            # 拉取新镜像
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

            # 备份旧容器（保留回滚能力）
            if docker ps -q --filter "name=${{ env.CONTAINER_NAME }}" | grep -q .; then
              OLD_IMAGE=$(docker inspect --format='{{.Config.Image}}' ${{ env.CONTAINER_NAME }})
              echo "OLD_IMAGE=$OLD_IMAGE" >> /tmp/deploy-backup.env
              docker rename ${{ env.CONTAINER_NAME }} ${{ env.CONTAINER_NAME }}-old || true
            fi

            # 确保 .env 文件存在（由运维预先部署到服务器）
            ENV_FILE="/opt/guoxue/.env.${{ github.event.inputs.environment }}"
            if [ ! -f "$ENV_FILE" ]; then
              echo "错误: 环境变量文件 $ENV_FILE 不存在，请先部署 .env 文件到服务器"
              exit 1
            fi

            # 启动新容器（通过 --env-file 注入全部 54 项环境变量）
            docker run -d \
              --name ${{ env.CONTAINER_NAME }} \
              --restart unless-stopped \
              -p ${{ secrets.APP_PORT || '3000' }}:3000 \
              --env-file "$ENV_FILE" \
              -e DATABASE_URL="${{ secrets.DATABASE_URL }}" \
              -e JWT_SECRET="${{ secrets.JWT_SECRET }}" \
              -e NODE_ENV=${{ github.event.inputs.environment }} \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

            # 数据库迁移
            if [ "${{ github.event.inputs.run_migration }}" = "true" ]; then
              echo "执行数据库迁移..."
              sleep 5  # 等待服务完全启动
              if docker exec ${{ env.CONTAINER_NAME }} sh -c "cd /app/apps/server && npx prisma migrate deploy"; then
                echo "数据库迁移成功"
              else
                echo "数据库迁移失败，回滚..."
                docker rm -f ${{ env.CONTAINER_NAME }}
                if [ -f /tmp/deploy-backup.env ]; then
                  source /tmp/deploy-backup.env
                  if docker ps -q --filter "name=${{ env.CONTAINER_NAME }}-old" | grep -q .; then
                    docker rename ${{ env.CONTAINER_NAME }}-old ${{ env.CONTAINER_NAME }}
                  fi
                fi
                exit 1
              fi
            else
              echo "跳过数据库迁移"
            fi

            # 健康检查（等待最多30秒）
            echo "等待服务就绪..."
            for i in $(seq 1 15); do
              if curl -sf http://localhost:${{ secrets.APP_PORT || '3000' }}/api/v1/health > /dev/null 2>&1; then
                echo "健康检查通过"
                break
              fi
              if [ $i -eq 15 ]; then
                echo "健康检查失败，回滚..."
                docker rm -f ${{ env.CONTAINER_NAME }}
                if [ -f /tmp/deploy-backup.env ]; then
                  source /tmp/deploy-backup.env
                  if docker ps -q --filter "name=${{ env.CONTAINER_NAME }}-old" | grep -q .; then
                    docker rename ${{ env.CONTAINER_NAME }}-old ${{ env.CONTAINER_NAME }}
                  fi
                fi
                exit 1
              fi
              sleep 2
            done

            # 清理旧容器和旧镜像
            docker rm -f ${{ env.CONTAINER_NAME }}-old 2>/dev/null || true
            docker image prune -f --filter "until=24h"

      - name: 部署结果通知
        if: always()
        run: |
          DEPLOY_STATUS="${{ steps.deploy.outcome }}"
          SERVICE_NAME="${{ env.IMAGE_NAME }}"
          IMAGE_TAG="${{ env.IMAGE_TAG }}"
          ENV_NAME="${{ github.event.inputs.environment }}"

          if [ "$DEPLOY_STATUS" = "success" ]; then
            TITLE="部署成功"
            CONTENT="${SERVICE_NAME}:${IMAGE_TAG} → ${ENV_NAME} 部署完成"
            COLOR="info"
          else
            TITLE="部署失败"
            CONTENT="${SERVICE_NAME}:${IMAGE_TAG} → ${ENV_NAME} 部署失败，已自动回滚"
            COLOR="warning"
          fi

          echo "$TITLE — $CONTENT"

          # 企业微信机器人通知
          if [ -n "${{ secrets.WEWORK_WEBHOOK_ALERT_URL }}" ]; then
            curl -s -X POST "${{ secrets.WEWORK_WEBHOOK_ALERT_URL }}" \
              -H "Content-Type: application/json" \
              -d "{\"msgtype\":\"markdown\",\"markdown\":{\"content\":\"## ${TITLE}\n> 服务: ${SERVICE_NAME}\n> 标签: ${IMAGE_TAG}\n> 环境: ${ENV_NAME}\n> ${CONTENT}\"}}" \
              || true
          fi
