name: APP编译器实际加载与产物阻断核验
on:
  push:
    branches: [codex/braces-build-verify-20261002]
    paths: [.github/workflows/app-compiler-check.yml]
permissions:
  contents: read
jobs:
  compiler:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      SOURCE_COMMIT: 1abd0eb7b5d6f225d26c6b2d5b83d6b32d42c40d
      NODE_OPTIONS: --max-old-space-size=6144
      VITE_API_URL: https://api.rebugx.cn
      VITE_PUBLIC_H5_URL: https://gx.yrydai.com/h5/
      VITE_PUBLIC_ASSET_ORIGIN: https://static.rebugx.cn
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          persist-credentials: true
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/.claude/
      - name: 清除临时鉴权并确认源码
        run: |
          git config --local --unset-all http.https://github.com/.extraheader || true
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          mkdir -p artifacts/app-compiler
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.33.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 核对实际编译器及底层异常
        working-directory: apps/mobile
        run: |
          node <<'NODE'
          const fs=require('fs'),path=require('path');
          process.env.UNI_CLI_CONTEXT=process.cwd();
          const result={sourceCommit:process.env.SOURCE_COMMIT,node:process.version,platform:process.platform,production:false,checks:[]};
          for(const name of ['@dcloudio/uts','@dcloudio/uni-uts-v1']) {
            try{const entry=require.resolve(name);require(name);result.checks.push({name,loaded:true,path:path.relative(process.cwd(),entry)});}
            catch(e){result.checks.push({name,loaded:false,code:e.code||null,message:String(e.message||e),stack:String(e.stack||'').split('\n').slice(0,6)});}
          }
          try{require('@dcloudio/uni-cli-shared').resolveUTSCompiler(true);result.resolverPassed=true;}
          catch(e){result.resolverPassed=false;result.resolverError=String(e.stack||e);}
          fs.writeFileSync('../../artifacts/app-compiler/diagnostic.json',JSON.stringify(result,null,2));
          console.log(JSON.stringify(result,null,2));
          NODE
      - name: 单独构建APP并核验真实资源存在
        run: |
          set -euo pipefail
          pnpm --filter @guoxue/shared build
          pnpm --filter @guoxue/mobile build:app 2>&1 | tee artifacts/app-compiler/build.log
          node -e 'const fs=require("fs");const d="apps/mobile/dist/build/app";const walk=p=>fs.readdirSync(p,{withFileTypes:true}).flatMap(x=>x.isDirectory()?walk(p+"/"+x.name):[p+"/"+x.name]);const files=walk(d);fs.writeFileSync("artifacts/app-compiler/files.json",JSON.stringify(files));if(!files.some(x=>x.endsWith("/app-service.js")))throw Error("APP资源不完整，拒绝把退出码0写成成功");'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: app-compiler-${{ env.SOURCE_COMMIT }}-${{ github.run_id }}
          path: artifacts/app-compiler/
          retention-days: 14
          if-no-files-found: error
