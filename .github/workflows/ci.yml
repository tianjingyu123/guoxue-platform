name: CI — 国学平台

on:
  push:
    branches: [master, main, develop, "codex/launch-review-*"]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".claude/**"
  pull_request:
    branches: [master, main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".claude/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: "10.33.3"
  NODE_VERSION: "24.18.0"

jobs:
  # ─── 类型检查 ───
  typecheck:
    name: TypeScript 类型检查
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: 生成 Prisma Client
        working-directory: apps/server
        run: npx prisma generate

      - name: 构建 Server 工作区前置包
        run: |
          pnpm --filter @guoxue/shared build
          pnpm --filter @guoxue/bazi-engine build
          pnpm --filter @guoxue/ziwei-engine build

      - name: tsc --noEmit
        working-directory: apps/server
        run: npx tsc --noEmit

  # ─── 代码风格 ───
  lint:
    name: ESLint + Prettier
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Prettier 格式检查
        run: pnpm format:check || echo "⚠ Prettier 检查未通过（非阻断）"

      - name: ESLint
        working-directory: apps/server
        run: npx eslint src --ext .ts --quiet

  # ─── 迁移与上线安全门禁 ───
  release-safety:
    name: 迁移与上线代码门禁
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: 执行迁移、切流、回滚与运行门禁
        run: |
          set -o pipefail
          pnpm release:gate:code 2>&1 | tee release-gate.log || {
            detail="$(tail -n 45 release-gate.log | tr '\n' ' ' | cut -c 1-3000)"
            echo "::error title=上线代码门禁失败::${detail:-请检查门禁日志}"
            exit 1
          }

  # ─── 单元测试 ───
  test:
    name: 单元测试 (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    needs: [typecheck]
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/3", "2/3", "3/3"]

    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:a36250871de0833b8757561c72f2477ef1ddd1101afa4e617fb552e0de514c6b
        env:
          POSTGRES_USER: guoxue_test
          POSTGRES_PASSWORD: test123
          POSTGRES_DB: guoxue_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: 生成 Prisma Client
        working-directory: apps/server
        run: npx prisma generate

      - name: 构建测试依赖工作区包
        run: |
          pnpm --filter @guoxue/shared build
          pnpm --filter @guoxue/bazi-engine build
          pnpm --filter @guoxue/ziwei-engine build

      - name: 运行 Prisma 迁移
        working-directory: apps/server
        run: npx prisma db push --skip-generate
        env:
          DATABASE_URL: postgresql://guoxue_test:test123@localhost:5432/guoxue_test

      - name: 运行测试 — shard ${{ matrix.shard }}
        working-directory: apps/server
        run: |
          set -o pipefail
          npx jest --config jest.config.ts --shard=${{ matrix.shard }} --no-coverage --maxWorkers=2 2>&1 | tee jest-shard.log || {
            detail="$(awk '/^FAIL / { print; for (i=0; i<18; i++) { if (getline <= 0) break; print }; exit }' jest-shard.log | tr '\n' ' ' | cut -c 1-3000)"
            echo "::error title=单元测试 ${{ matrix.shard }} 失败::${detail:-请检查测试日志}"
            exit 1
          }
        env:
          DATABASE_URL: postgresql://guoxue_test:test123@localhost:5432/guoxue_test
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: "test-jwt-secret-32-bytes-key-!"
          ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef"
          NODE_ENV: test

  # ─── 测试报告 ───
  test-report:
    name: 测试结果汇总
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [typecheck, lint, test, release-safety]
    if: always()
    steps:
      - name: 汇总
        run: |
          echo "  - typecheck: ${{ needs.typecheck.result }}"
          echo "  - lint: ${{ needs.lint.result }}"
          echo "  - test: ${{ needs.test.result }}"
          echo "  - release-safety: ${{ needs['release-safety'].result }}"
          if [[ "${{ needs.typecheck.result }}" != "success" || "${{ needs.lint.result }}" != "success" || "${{ needs.test.result }}" != "success" || "${{ needs['release-safety'].result }}" != "success" ]]; then
            echo "前置检查未全部通过"
            exit 1
          fi
          echo "全部检查通过"

  # ─── 构建 ───
  build:
    name: 构建产物
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [test, lint, release-safety]
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/codex/launch-review-') || github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: 生成 Prisma Client
        working-directory: apps/server
        run: npx prisma generate

      - name: 构建 Server 工作区前置包
        run: |
          pnpm --filter @guoxue/shared build
          pnpm --filter @guoxue/bazi-engine build
          pnpm --filter @guoxue/ziwei-engine build

      - name: 构建后端
        working-directory: apps/server
        run: pnpm run build

      - name: 上传构建产物
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: server-build
          path: apps/server/dist/
          retention-days: 7
