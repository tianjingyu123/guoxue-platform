name: CI — 国学平台

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".claude/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".claude/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: "10.33.3"
  NODE_VERSION: "20"

jobs:
  # ─── 类型检查 ───
  typecheck:
    name: TypeScript 类型检查
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: 生成 Prisma Client
        working-directory: apps/server
        run: npx prisma generate

      - name: tsc --noEmit
        working-directory: apps/server
        run: npx tsc --noEmit

  # ─── 代码风格 ───
  lint:
    name: ESLint + Prettier
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Prettier 格式检查
        run: pnpm format:check || echo "⚠ Prettier 检查未通过（非阻断）"

      - name: ESLint
        working-directory: apps/server
        run: npx eslint src --ext .ts --max-warnings 20

  # ─── 迁移与上线安全门禁 ───
  release-safety:
    name: 迁移与上线代码门禁
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: 执行迁移、切流、回滚与运行门禁
        run: pnpm release:gate:code

  # ─── 单元测试 ───
  test:
    name: 单元测试 (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [typecheck]
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/3", "2/3", "3/3"]

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: guoxue_test
          POSTGRES_PASSWORD: test123
          POSTGRES_DB: guoxue_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: 生成 Prisma Client
        working-directory: apps/server
        run: npx prisma generate

      - name: 运行 Prisma 迁移
        working-directory: apps/server
        run: npx prisma db push --skip-generate
        env:
          DATABASE_URL: postgresql://guoxue_test:test123@localhost:5432/guoxue_test

      - name: 运行测试 — shard ${{ matrix.shard }}
        working-directory: apps/server
        run: npx jest --config jest.config.ts --shard=${{ matrix.shard }} --no-coverage --maxWorkers=2
        env:
          DATABASE_URL: postgresql://guoxue_test:test123@localhost:5432/guoxue_test
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: "test-jwt-secret-32-bytes-key-!"
          ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef"
          NODE_ENV: test

  # ─── 测试报告 ───
  test-report:
    name: 测试结果汇总
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [typecheck, lint, test, release-safety]
    if: always()
    steps:
      - name: 汇总
        run: |
          echo "✅ 全部测试完成"
          echo "  - typecheck: ${{ needs.typecheck.result }}"
          echo "  - lint: ${{ needs.lint.result }}"
          echo "  - test: ${{ needs.test.result }}"
          echo "  - release-safety: ${{ needs['release-safety'].result }}"

  # ─── 构建 ───
  build:
    name: 构建产物
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [test, lint, release-safety]
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: 生成 Prisma Client
        working-directory: apps/server
        run: npx prisma generate

      - name: 构建后端
        working-directory: apps/server
        run: pnpm run build

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: server-build
          path: apps/server/dist/
          retention-days: 7
