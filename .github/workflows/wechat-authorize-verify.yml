name: 微信账号绑定与移动端隔离构建验证
on:
  push:
    branches: [codex/wechat-authorize-verify-20261003]
    paths: [.github/workflows/wechat-authorize-verify.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      SOURCE_COMMIT: fd488b9bfd820f839808a4dc3df2e810ca12813f
      NODE_OPTIONS: --max-old-space-size=6144
      VITE_API_URL: https://api.rebugx.cn
      VITE_PUBLIC_H5_URL: https://gx.yrydai.com/h5/
      VITE_PUBLIC_ASSET_ORIGIN: https://static.rebugx.cn
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/.claude/
      - name: 核验隔离源码身份并清除临时鉴权
        run: |
          set -euo pipefail
          git config --local --unset-all http.https://github.com/.extraheader || true
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          mkdir -p artifacts/wechat-authorize
          git rev-parse HEAD > artifacts/wechat-authorize/source-binding.txt
          git ls-files -z package.json pnpm-lock.yaml pnpm-workspace.yaml .pnpmfile.cjs patches apps/mobile packages | xargs -0 sha256sum >> artifacts/wechat-authorize/source-binding.txt
          printf '%s\n' "VITE_API_URL=$VITE_API_URL" "VITE_PUBLIC_H5_URL=$VITE_PUBLIC_H5_URL" "VITE_PUBLIC_ASSET_ORIGIN=$VITE_PUBLIC_ASSET_ORIGIN" > artifacts/wechat-authorize/public-config.env
          cp artifacts/wechat-authorize/public-config.env apps/mobile/.env.production
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.33.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
          cache: pnpm
      - name: 恢复本任务冻结依赖
        run: pnpm install --frozen-lockfile
      - name: 实际登录页合成契约与完整移动类型检查
        run: |
          set -euo pipefail
          pnpm --filter @guoxue/shared build
          cd apps/mobile
          node scripts/test-wechat-code-login.cjs --result ../../artifacts/wechat-authorize/contracts.json
          node scripts/test-wechat-account-binding.cjs > ../../artifacts/wechat-authorize/binding-contracts.json
          pnpm exec eslint src/App.vue src/pkg-auth/login/index.vue src/pkg-mine/bind-accounts/index.vue src/utils/wechat-account-binding.ts src/lib/auth-data.ts src/lib/mine-data.ts --format json --output-file ../../artifacts/wechat-authorize/eslint.json
          pnpm type-check 2>&1 | tee ../../artifacts/wechat-authorize/types.log
      - name: 各移动端成品构建与小程序体积门禁
        run: |
          set -euo pipefail
          pnpm --filter @guoxue/mobile build:h5 2>&1 | tee artifacts/wechat-authorize/h5.log
          pnpm --filter @guoxue/mobile build:mp-weixin 2>&1 | tee artifacts/wechat-authorize/mp.log
          pnpm --filter @guoxue/mobile build:app 2>&1 | tee artifacts/wechat-authorize/app.log
          pnpm --filter @guoxue/mobile build:app-harmony 2>&1 | tee artifacts/wechat-authorize/harmony.log
      - name: 核对实际产物并记录校验值
        run: |
          node <<'NODE'
          const fs=require('node:fs'),path=require('node:path'),assert=require('node:assert/strict'),crypto=require('node:crypto');
          const root='apps/mobile/dist/build';
          const required={h5:['index.html'],'mp-weixin':['app.json','app.js'],app:['app-service.js','app-config-service.js','manifest.json','__uniappview.html'],'app-harmony':['app-service.js','manifest.json']};
          const targets=[];
          for(const [target,entries] of Object.entries(required)) {
            const base=path.join(root,target);
            for(const entry of entries) assert(fs.statSync(path.join(base,entry)).size>0,`${target}/${entry}缺失或为空`);
            const walk=d=>fs.readdirSync(d,{withFileTypes:true}).flatMap(x=>x.isDirectory()?walk(path.join(d,x.name)):[path.join(d,x.name)]);
            const files=walk(base).sort().map(file=>({path:path.relative(base,file).split(path.sep).join('/'),size:fs.statSync(file).size,sha256:crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex')}));
            targets.push({target,files});
          }
          const app=fs.readFileSync(path.join(root,'app/app-service.js'),'utf8');
          assert(/onlyAuthorize\s*:\s*(?:true|!0)/.test(app),'APP成品没有仅授权参数');
          const tests=JSON.parse(fs.readFileSync('artifacts/wechat-authorize/contracts.json','utf8'));
          assert.equal(tests.passed,14);assert.equal(tests.failed,0);
          const bindingTests=JSON.parse(fs.readFileSync('artifacts/wechat-authorize/binding-contracts.json','utf8'));
          assert.equal(bindingTests.passed,27);assert.equal(bindingTests.failed,0);
          fs.writeFileSync('artifacts/wechat-authorize/products.json',JSON.stringify({sourceCommit:process.env.SOURCE_COMMIT,targets,contractsPassed:14,bindingContractsPassed:27,production:false,realAuthorization:false,signedPackage:false,officialMiniUpload:false},null,2));
          console.log(JSON.stringify({targets:targets.map(x=>({target:x.target,files:x.files.length})),passed:14,bindingPassed:27,realAuthorization:false}));
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: wechat-authorize-${{ env.SOURCE_COMMIT }}-${{ github.run_id }}
          path: artifacts/wechat-authorize/
          retention-days: 14
          if-no-files-found: error
