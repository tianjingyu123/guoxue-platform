# 生产环境覆盖配置
# 用法: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:-guoxue123}
      # 生产性能调优
      POSTGRES_SHARED_BUFFERS: 256MB
      POSTGRES_EFFECTIVE_CACHE_SIZE: 768MB
      POSTGRES_MAINTENANCE_WORK_MEM: 64MB
      POSTGRES_WAL_BUFFERS: 16MB
      POSTGRES_WORK_MEM: 4MB
      POSTGRES_MAX_CONNECTIONS: 100
    volumes:
      - pgdata:/var/lib/postgresql/data
    # 生产库不对外暴露端口
    ports: !reset []
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  redis:
    # 生产 Redis 不对外暴露端口
    ports: !reset []
    volumes:
      - redisdata:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: redis-server /usr/local/etc/redis/redis.conf
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "30m"
        max-file: "2"

  server:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-postgresql://guoxue:${DB_PASSWORD:-guoxue123}@postgres:5432/guoxue}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      PORT: 3000
      PRISMA_SLOW_QUERY_MS: ${PRISMA_SLOW_QUERY_MS:-500}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://guoxue.ac.cn}
      # 云服务凭证
      COS_SECRET_ID: ${COS_SECRET_ID}
      COS_SECRET_KEY: ${COS_SECRET_KEY}
      COS_BUCKET: ${COS_BUCKET}
      COS_REGION: ${COS_REGION:-ap-guangzhou}
      COS_CDN_BASE: ${COS_CDN_BASE:-}
      # 微信
      WECHAT_APP_ID: ${WECHAT_APP_ID}
      WECHAT_APP_SECRET: ${WECHAT_APP_SECRET}
      WECHAT_MINI_APP_ID: ${WECHAT_MINI_APP_ID:-}
      WECHAT_MP_APP_ID: ${WECHAT_MP_APP_ID:-}
      # 微信支付 V3
      WECHAT_PAY_MCH_ID: ${WECHAT_PAY_MCH_ID:-}
      WECHAT_PAY_SERIAL_NO: ${WECHAT_PAY_SERIAL_NO:-}
      WECHAT_PAY_API_V3_KEY: ${WECHAT_PAY_API_V3_KEY:-}
      WECHAT_PAY_PRIVATE_KEY: ${WECHAT_PAY_PRIVATE_KEY:-}
      # IM
      IM_APP_ID: ${IM_APP_ID}
      IM_ADMIN_KEY: ${IM_ADMIN_KEY}
      # 快递
      KUAIDI100_API_KEY: ${KUAIDI100_API_KEY:-}
      KUAIDI100_CUSTOMER: ${KUAIDI100_CUSTOMER:-}
      # SMS
      SMS_APP_ID: ${SMS_APP_ID:-}
      SMS_SIGN_NAME: ${SMS_SIGN_NAME:-}
      # AI
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      # 腾讯云
      TENCENT_SECRET_ID: ${TENCENT_SECRET_ID:-}
      TENCENT_SECRET_KEY: ${TENCENT_SECRET_KEY:-}
      # 邮件
      EMAIL_MODE: ${EMAIL_MODE:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:3000/api/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  # ═══════════════════════════════════════
  # Nginx 反向代理
  # ═══════════════════════════════════════
  nginx:
    image: nginx:1.27-alpine
    container_name: guoxue-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - uploads_data:/var/www/uploads:ro
      - static_data:/var/www/static:ro
      - certbot_www:/var/www/certbot
    depends_on:
      server:
        condition: service_healthy
    networks:
      - default
      - monitoring
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost/nginx-health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "30m"
        max-file: "3"

  # ═══════════════════════════════════════
  # SSL 证书自动续期
  # ═══════════════════════════════════════
  certbot:
    image: certbot/certbot:v3.2.0
    container_name: guoxue-certbot
    volumes:
      - ./nginx/ssl:/etc/letsencrypt/live/guoxue.ac.cn
      - certbot_www:/var/www/certbot
    entrypoint: >
      /bin/sh -c "
      trap exit TERM;
      while :; do
        certbot renew --quiet;
        sleep 12h;
      done
      "
    deploy:
      resources:
        limits:
          memory: 64M

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
  uploads_data:
    driver: local
  static_data:
    driver: local
  certbot_www:
    driver: local
