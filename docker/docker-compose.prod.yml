# 生产环境覆盖配置
# 用法: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:?生产环境必须设置 DB_PASSWORD}
      # 生产性能调优
      POSTGRES_SHARED_BUFFERS: 256MB
      POSTGRES_EFFECTIVE_CACHE_SIZE: 768MB
      POSTGRES_MAINTENANCE_WORK_MEM: 64MB
      POSTGRES_WAL_BUFFERS: 16MB
      POSTGRES_WORK_MEM: 4MB
      POSTGRES_MAX_CONNECTIONS: 100
    volumes:
      - pgdata:/var/lib/postgresql/data
    # 生产库不对外暴露端口
    ports: !reset []
    networks:
      - default
      - monitoring
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  redis:
    # 生产 Redis 不对外暴露端口
    ports: !reset []
    volumes:
      - redisdata:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: redis-server /usr/local/etc/redis/redis.conf
    networks:
      - default
      - monitoring
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "30m"
        max-file: "2"

  server:
    container_name: guoxue-server
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:?生产环境必须设置 VITE_API_URL}
        VITE_PUBLIC_H5_URL: ${VITE_PUBLIC_H5_URL:?生产环境必须设置 VITE_PUBLIC_H5_URL}
        VITE_PUBLIC_ASSET_ORIGIN: ${VITE_PUBLIC_ASSET_ORIGIN:?生产环境必须设置 VITE_PUBLIC_ASSET_ORIGIN}
    # 生产环境仅允许 Nginx 暴露 80/443，后端端口不直接暴露到公网。
    ports: !reset []
    networks:
      - default
      - monitoring
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?生产环境必须设置 DATABASE_URL}
      DATABASE_REPLICA_URL: ${DATABASE_REPLICA_URL:-}
      REDIS_URL: ${REDIS_URL:?生产环境必须设置 REDIS_URL}
      JWT_SECRET: ${JWT_SECRET:?生产环境必须设置 JWT_SECRET}
      JWT_PREVIOUS_SECRETS: ${JWT_PREVIOUS_SECRETS:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?生产环境必须设置 ENCRYPTION_KEY}
      BIGSCREEN_SECRET: ${BIGSCREEN_SECRET:?生产环境必须设置 BIGSCREEN_SECRET}
      RUN_DB_MIGRATIONS: ${RUN_DB_MIGRATIONS:-false}
      PORT: 3000
      PRISMA_SLOW_QUERY_MS: ${PRISMA_SLOW_QUERY_MS:-500}
      CORS_ORIGIN: ${CORS_ORIGIN:?生产环境必须设置 CORS_ORIGIN}
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?生产环境必须设置 PUBLIC_DOMAIN}
      PUBLIC_API_URL: ${PUBLIC_API_URL:?生产环境必须设置 PUBLIC_API_URL}
      PUBLIC_H5_URL: ${PUBLIC_H5_URL:?生产环境必须设置 PUBLIC_H5_URL}
      PUBLIC_ASSET_ORIGIN: ${PUBLIC_ASSET_ORIGIN:?生产环境必须设置 PUBLIC_ASSET_ORIGIN}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      WS_CORS_ORIGIN: ${WS_CORS_ORIGIN:-}
      # 云服务凭证
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-auto}
      TENCENT_CREDENTIAL_MODE: ${TENCENT_CREDENTIAL_MODE:-static}
      TENCENT_CVM_ROLE_NAME: ${TENCENT_CVM_ROLE_NAME:-}
      COS_SECRET_ID: ${COS_SECRET_ID:-}
      COS_SECRET_KEY: ${COS_SECRET_KEY:-}
      COS_BUCKET: ${COS_BUCKET}
      COS_REGION: ${COS_REGION:-ap-guangzhou}
      COS_CDN_BASE: ${COS_CDN_BASE:-}
      # 微信
      WECHAT_APP_ID: ${WECHAT_APP_ID}
      WECHAT_APP_SECRET: ${WECHAT_APP_SECRET}
      WECHAT_OFFICIAL_APPID: ${WECHAT_OFFICIAL_APPID:-}
      WECHAT_OFFICIAL_APP_SECRET: ${WECHAT_OFFICIAL_APP_SECRET:-}
      WECHAT_MINI_APP_ID: ${WECHAT_MINI_APP_ID:-}
      MINIPROGRAM_APP_SECRET: ${MINIPROGRAM_APP_SECRET:-}
      WECHAT_MP_APP_ID: ${WECHAT_MP_APP_ID:-}
      # 微信支付 V3
      WECHAT_PAY_APP_ID: ${WECHAT_PAY_APP_ID:-}
      WECHAT_PAY_MCH_ID: ${WECHAT_PAY_MCH_ID:-}
      WECHAT_PAY_ALLOWED_MCH_ID: ${WECHAT_PAY_ALLOWED_MCH_ID:-}
      WECHAT_PAY_SERIAL_NO: ${WECHAT_PAY_SERIAL_NO:-}
      WECHAT_PAY_API_V3_KEY: ${WECHAT_PAY_API_V3_KEY:-}
      WECHAT_PAY_PRIVATE_KEY: ${WECHAT_PAY_PRIVATE_KEY:-}
      WECHAT_PAY_NOTIFY_URL: ${WECHAT_PAY_NOTIFY_URL:-}
      WECHAT_PAY_REFUND_NOTIFY_URL: ${WECHAT_PAY_REFUND_NOTIFY_URL:-}
      # Apple 应用内购买
      APPLE_IAP_KEY_ID: ${APPLE_IAP_KEY_ID:-}
      APPLE_IAP_REQUIRED: ${APPLE_IAP_REQUIRED:-false}
      APPLE_IAP_ISSUER_ID: ${APPLE_IAP_ISSUER_ID:-}
      APPLE_IAP_PRIVATE_KEY_BASE64: ${APPLE_IAP_PRIVATE_KEY_BASE64:-}
      APPLE_IAP_PRIVATE_KEY: ${APPLE_IAP_PRIVATE_KEY:-}
      APPLE_IAP_BUNDLE_ID: ${APPLE_IAP_BUNDLE_ID:-com.rebu.iosapprebu}
      APPLE_IAP_APP_APPLE_ID: ${APPLE_IAP_APP_APPLE_ID:-6756602923}
      APPLE_IAP_ENVIRONMENT: ${APPLE_IAP_ENVIRONMENT:-AUTO}
      APPLE_IAP_PRODUCTS_JSON: ${APPLE_IAP_PRODUCTS_JSON:-}
      ALIPAY_NOTIFY_URL: ${ALIPAY_NOTIFY_URL:-}
      UNIONPAY_NOTIFY_URL: ${UNIONPAY_NOTIFY_URL:-}
      HUIFU_NOTIFY_URL: ${HUIFU_NOTIFY_URL:-}
      HUIFU_MIGRATE_LEGACY_CONFIG: ${HUIFU_MIGRATE_LEGACY_CONFIG:-false}
      # IM
      IM_APP_ID: ${IM_APP_ID}
      IM_ADMIN_KEY: ${IM_ADMIN_KEY}
      # 快递
      KUAIDI100_API_KEY: ${KUAIDI100_API_KEY:-}
      KUAIDI100_CUSTOMER: ${KUAIDI100_CUSTOMER:-}
      KUAIDI100_CALLBACK_URL: ${KUAIDI100_CALLBACK_URL:-}
      KUAIDI100_SALT: ${KUAIDI100_SALT:-}
      # SMS
      SMS_APP_ID: ${SMS_APP_ID:-}
      SMS_SIGN_NAME: ${SMS_SIGN_NAME:-}
      SMS_TEMPLATE_ID: ${SMS_TEMPLATE_ID:-}
      SMS_CHURN_TEMPLATE_ID: ${SMS_CHURN_TEMPLATE_ID:-}
      # AI
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-https://api.anthropic.com}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      DASHSCOPE_BASE_URL: ${DASHSCOPE_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      LOCAL_MODEL_BASE_URL: ${LOCAL_MODEL_BASE_URL:-http://localhost:11434/v1}
      LOCAL_MODEL_API_KEY: ${LOCAL_MODEL_API_KEY:-}
      # 腾讯云
      TENCENT_SECRET_ID: ${TENCENT_SECRET_ID:-}
      TENCENT_SECRET_KEY: ${TENCENT_SECRET_KEY:-}
      # 邮件
      EMAIL_MODE: ${EMAIL_MODE:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      # 可观测性 — OTLP 链路追踪
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4318/v1/traces}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-guoxue-platform}
    volumes:
      - admin_dist:/app/admin-dist-shared
      - h5_dist:/app/h5-dist-shared
      # 只读共享宿主机 Nginx 日志，供 5xx/QPS 可观测任务增量分析。
      - /var/log/guoxue/nginx:/var/log/nginx:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "require(''http'').get(''http://localhost:3000/api/v1/health'', r => {process.exit(r.statusCode === 200 ? 0 : 1)})"',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  # ═══════════════════════════════════════
  # Nginx 反向代理
  # ═══════════════════════════════════════
  nginx:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    container_name: guoxue-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf.template:/etc/nginx/templates/nginx.conf.template:ro
      - ./nginx/security-headers.conf:/etc/nginx/snippets/security-headers.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - uploads_data:/var/www/uploads:ro
      - static_data:/var/www/static:ro
      - admin_dist:/var/www/admin:ro
      - h5_dist:/var/www/h5:ro
      - /var/log/guoxue/nginx:/var/log/nginx
    environment:
      NGINX_ENVSUBST_FILTER: "^(NGINX_SERVER_NAMES)$"
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx
      NGINX_SERVER_NAMES: ${NGINX_SERVER_NAMES:?生产环境必须设置 NGINX_SERVER_NAMES}
    depends_on:
      server:
        condition: service_healthy
    networks:
      - default
      - monitoring
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost/nginx-health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "30m"
        max-file: "3"

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
  uploads_data:
    driver: local
  static_data:
    driver: local
  admin_dist:
    driver: local
  h5_dist:
    driver: local

networks:
  monitoring:
    external: true
