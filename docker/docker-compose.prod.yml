# 生产环境覆盖配置
# 用法: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:-guoxue123}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # 生产库不对外暴露端口
    ports: !reset []

  redis:
    # 生产 Redis 不对外暴露端口
    ports: !reset []

  server:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-postgresql://guoxue:${DB_PASSWORD:-guoxue123}@postgres:5432/guoxue}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      PORT: 3000
      # 云服务凭证
      COS_SECRET_ID: ${COS_SECRET_ID}
      COS_SECRET_KEY: ${COS_SECRET_KEY}
      COS_BUCKET: ${COS_BUCKET}
      COS_REGION: ${COS_REGION:-ap-guangzhou}
      # 微信
      WECHAT_APP_ID: ${WECHAT_APP_ID}
      WECHAT_APP_SECRET: ${WECHAT_APP_SECRET}
      WECHAT_MINI_APP_ID: ${WECHAT_MINI_APP_ID:-}
      WECHAT_MP_APP_ID: ${WECHAT_MP_APP_ID:-}
      # 微信支付 V3
      WECHAT_PAY_MCH_ID: ${WECHAT_PAY_MCH_ID:-}
      WECHAT_PAY_SERIAL_NO: ${WECHAT_PAY_SERIAL_NO:-}
      WECHAT_PAY_API_V3_KEY: ${WECHAT_PAY_API_V3_KEY:-}
      WECHAT_PAY_PRIVATE_KEY: ${WECHAT_PAY_PRIVATE_KEY:-}
      # IM
      IM_APP_ID: ${IM_APP_ID}
      IM_ADMIN_KEY: ${IM_ADMIN_KEY}
      IM_PRIVATE_KEY: ${IM_PRIVATE_KEY:-}
      IM_PUBLIC_KEY: ${IM_PUBLIC_KEY:-}
      # 快递100 (物流查询)
      EXPRESS_API_KEY: ${EXPRESS_API_KEY:-}
      # SMS
      SMS_APP_ID: ${SMS_APP_ID:-}
      SMS_SECRET: ${SMS_SECRET:-}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:3000/api/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
