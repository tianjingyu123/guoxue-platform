# 国学平台前端 Nginx 配置
# 放到服务器的 /etc/nginx/sites-available/guoxue-frontend
# 然后执行: ln -s /etc/nginx/sites-available/guoxue-frontend /etc/nginx/sites-enabled/
#          nginx -t && systemctl reload nginx

# ──────────────────────────────────────
# 移动端 H5 (m.guoxue.ac.cn)
# ──────────────────────────────────────
server {
    listen 80;
    server_name m.guoxue.ac.cn;

    # 静态文件
    root /opt/guoxue/frontend/mobile;
    index index.html;

    # SPA 路由: 所有非文件请求回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 代理到后端
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 静态资源长缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 日志
    access_log /var/log/nginx/m-guoxue-access.log;
    error_log /var/log/nginx/m-guoxue-error.log;
}

# ──────────────────────────────────────
# 管理后台 (admin.guoxue.ac.cn)
# ──────────────────────────────────────
server {
    listen 80;
    server_name admin.guoxue.ac.cn;

    root /opt/guoxue/frontend/admin;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    access_log /var/log/nginx/admin-guoxue-access.log;
    error_log /var/log/nginx/admin-guoxue-error.log;
}
