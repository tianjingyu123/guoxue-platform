# IIIF 图像服务 — 古籍原图对照基础设施
# 独立部署，与主 docker-compose.yml 配合使用
# 启动：docker compose -f docker-compose.yml -f docker-compose.iiif.yml up -d

services:
  # ── IIIF 图像服务器 ──
  cantaloupe:
    build:
      context: .
      dockerfile: Dockerfile.cantaloupe
    image: guoxue-cantaloupe:5.0.5-f8494ff9
    container_name: guoxue-cantaloupe
    restart: unless-stopped
    ports:
      # 仅供宿主机反向代理/验收访问，禁止直接暴露公网端口。
      - "127.0.0.1:8182:8182"
    volumes:
      - ./cantaloupe.properties:/etc/cantaloupe/cantaloupe.properties:ro
      - iiif_cache:/var/cache/cantaloupe
      - iiif_images:/data/images:ro
    environment:
      ENDPOINT_API_ENABLED: "true"
      ENDPOINT_API_USERNAME: ${CANTALOUPE_API_USERNAME:?CANTALOUPE_API_USERNAME is required}
      ENDPOINT_API_SECRET: ${CANTALOUPE_API_SECRET:?CANTALOUPE_API_SECRET is required}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8182/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    profiles: ["iiif"]

  # ── 对象存储（图像文件） ──
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    container_name: guoxue-minio
    restart: unless-stopped
    ports:
      - "127.0.0.1:9000:9000" # API，仅供宿主机访问
      - "127.0.0.1:9001:9001" # Web Console，仅供宿主机访问
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    profiles: ["iiif"]

volumes:
  iiif_cache:
  iiif_images:
  minio_data:
