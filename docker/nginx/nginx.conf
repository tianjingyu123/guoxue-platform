# 国学平台 — Nginx 反向代理
# 用途：SSL 终止、静态资源加速、API 限流、Grafana 代理
# 证书路径需挂载: /etc/nginx/ssl/fullchain.pem, /etc/nginx/ssl/privkey.pem

worker_processes auto;
worker_rlimit_nofile 65535;

events {
  worker_connections 4096;
  use epoll;
  multi_accept on;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # 日志格式
  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for" '
                  'rt=$request_time uct="$upstream_connect_time" '
                  'uht="$upstream_header_time" urt="$upstream_response_time"';

  access_log /var/log/nginx/access.log main buffer=16k;
  error_log /var/log/nginx/error.log warn;

  # 性能调优
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  keepalive_requests 100;
  types_hash_max_size 2048;
  server_tokens off;
  client_max_body_size 10m;
  client_body_buffer_size 128k;

  # Gzip 压缩
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_min_length 256;
  gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/json
    application/xml
    application/rss+xml
    image/svg+xml;

  # ── 限流区域 ──
  # API 限流: 60r/s per IP (burst 30)
  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/s;
  # 登录/注册严格限流: 5r/s per IP
  limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;
  # 连接数限制: 20 per IP
  limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

  # ── 上游服务 ──
  upstream server_backend {
    least_conn;
    server guoxue-server:3000 max_fails=3 fail_timeout=30s;
    keepalive 32;
  }

  upstream grafana_backend {
    server guoxue-grafana:3000;
  }

  # ── 域名映射 (主域名 + 多小程序备用域名) ──
  # MAIN:   guoxue.ac.cn
  # SHOP:   shop.guoxue.ac.cn
  # LIVE:   live.guoxue.ac.cn
  # BACKUP: guoxue-api.cn, guoxue-platform.cn (备用域名防封)

  map $host $domain_type {
    default                        "MAIN";
    "guoxue.ac.cn"                 "MAIN";
    "shop.guoxue.ac.cn"            "SHOP";
    "live.guoxue.ac.cn"            "LIVE";
    "guoxue-api.cn"                "BACKUP";
    "guoxue-platform.cn"           "BACKUP";
    "api.guoxue-api.cn"            "BACKUP";
    "api.guoxue-platform.cn"       "BACKUP";
  }

  # 主域名列表 (HTTP 重定向 + SSL)
  map $host $is_main_domain {
    default                        0;
    "guoxue.ac.cn"                 1;
    "shop.guoxue.ac.cn"            1;
    "live.guoxue.ac.cn"            1;
    "guoxue-api.cn"                1;
    "guoxue-platform.cn"           1;
    "api.guoxue-api.cn"            1;
    "api.guoxue-platform.cn"       1;
  }

  # ── HTTP — ACME 验证 + 重定向到 HTTPS (多域名) ──
  server {
    listen 80;
    server_name guoxue.ac.cn shop.guoxue.ac.cn live.guoxue.ac.cn
                guoxue-api.cn guoxue-platform.cn
                api.guoxue-api.cn api.guoxue-platform.cn;

    # Certbot/ACME 验证路径（不重定向）
    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    # 健康检查（不重定向）
    location /nginx-health {
      return 200 'ok';
      add_header Content-Type text/plain;
    }

    # 其余全部重定向到 HTTPS
    location / {
      return 301 https://$host$request_uri;
    }
  }

  # ── HTTPS 主站 (含多域名) ──
  server {
    listen 443 ssl http2;
    server_name guoxue.ac.cn shop.guoxue.ac.cn live.guoxue.ac.cn
                guoxue-api.cn guoxue-platform.cn
                api.guoxue-api.cn api.guoxue-platform.cn;

    # SSL 配置
    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 114.114.114.114 valid=300s;

    # 安全头
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 全局连接数限制
    limit_conn conn_limit 20;
    limit_req zone=api_limit burst=30 nodelay;

    # ── 静态资源 (uploads) ──
    location /uploads/ {
      alias /var/www/uploads/;
      expires 30d;
      add_header Cache-Control "public, immutable";
      limit_req zone=api_limit burst=60;
    }

    # ── 静态资源 (static) ──
    location /static/ {
      alias /var/www/static/;
      expires 7d;
      add_header Cache-Control "public";
      limit_req zone=api_limit burst=60;
    }

    # ── 健康检查 (不限流) ──
    location /api/v1/health {
      limit_req off;
      limit_conn off;
      proxy_pass http://server_backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── API ──
    location /api/ {
      proxy_pass http://server_backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Domain-Type $domain_type;
      proxy_read_timeout 60s;
      proxy_send_timeout 60s;
      proxy_buffering on;
      proxy_buffer_size 4k;
      proxy_buffers 8 16k;

      # 登录/注册接口额外限流
      location ~ ^/api/v1/auth/(login|register|sms/send|sms/verify) {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://server_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
      }
    }

    # ── 管理后台 SPA ──
    location /admin {
      # 精确匹配 /admin → 重定向到 /admin/
      return 301 $scheme://$host/admin/;
    }

    location /admin/ {
      root /var/www;
      try_files $uri $uri/ /admin/index.html;
      expires 7d;
      add_header Cache-Control "public, must-revalidate";

      # 管理后台 API 和静态资源不限流
      limit_req zone=api_limit burst=60 nodelay;
    }

    # ── Swagger 文档 (内网限 IP 访问) ──
    location /api-docs {
      satisfy any;
      allow 10.0.0.0/8;
      allow 172.16.0.0/12;
      allow 192.168.0.0/16;
      deny all;
      proxy_pass http://server_backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
    }

    # ── Grafana 监控 (内网限 IP 访问) ──
    location /grafana/ {
      satisfy any;
      allow 10.0.0.0/8;
      allow 172.16.0.0/12;
      allow 192.168.0.0/16;
      deny all;
      proxy_pass http://grafana_backend/;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $host;
    }

    # ── 根路径 ──
    location / {
      return 200 '{"status":"ok","message":"国学平台 API"}';
      add_header Content-Type application/json;
    }
  }

}
