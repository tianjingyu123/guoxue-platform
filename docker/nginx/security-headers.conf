# 公共安全响应头。
# 注意：Nginx 的 add_header 只要在 location 中再次声明，就不会继承上级配置，
# 因此所有自定义 Cache-Control / Content-Type 的 location 都必须同时 include 本文件。
# API 由 Helmet 生成同类安全头；反向代理统一隐藏上游副本后再由入口补一份，
# 避免浏览器收到逗号拼接的重复 HSTS、X-Frame-Options 等响应头。
proxy_hide_header Strict-Transport-Security;
proxy_hide_header X-Frame-Options;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Permissions-Policy;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(self), geolocation=(self)" always;
