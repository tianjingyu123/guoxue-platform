version: "3.9"

services:
  # ── 数据库 ──
  postgres:
    image: postgres:16-alpine
    container_name: guoxue-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: guoxue
      POSTGRES_PASSWORD: guoxue123
      POSTGRES_DB: guoxue
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guoxue"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── 缓存 ──
  redis:
    image: redis:7-alpine
    container_name: guoxue-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── 后端服务 ──
  server:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: guoxue-server
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://guoxue:guoxue123@postgres:5432/guoxue
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      PORT: 3000
      # COS / 微信 / IM 凭证通过环境变量注入
      COS_SECRET_ID: ${COS_SECRET_ID:-}
      COS_SECRET_KEY: ${COS_SECRET_KEY:-}
      COS_BUCKET: ${COS_BUCKET:-}
      COS_REGION: ${COS_REGION:-ap-guangzhou}
      WECHAT_APP_ID: ${WECHAT_APP_ID:-}
      WECHAT_APP_SECRET: ${WECHAT_APP_SECRET:-}
      IM_APP_ID: ${IM_APP_ID:-}
      IM_ADMIN_KEY: ${IM_ADMIN_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
