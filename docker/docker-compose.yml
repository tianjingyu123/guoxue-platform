services:
  # ── 数据库 ──
  postgres:
    image: pgvector/pgvector:pg16@sha256:a36250871de0833b8757561c72f2477ef1ddd1101afa4e617fb552e0de514c6b
    container_name: guoxue-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: guoxue
      POSTGRES_PASSWORD: guoxue123
      POSTGRES_DB: guoxue
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guoxue"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── 数据库读副本（可选，启用 HA profile 时启动）──
  postgres-replica:
    image: pgvector/pgvector:pg16@sha256:a36250871de0833b8757561c72f2477ef1ddd1101afa4e617fb552e0de514c6b
    container_name: guoxue-postgres-replica
    restart: unless-stopped
    profiles: ["ha"]
    environment:
      POSTGRES_USER: guoxue
      POSTGRES_PASSWORD: guoxue123
      POSTGRES_DB: guoxue
    volumes:
      - pgdata-replica:/var/lib/postgresql/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guoxue"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── 缓存 ──
  redis:
    image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    container_name: guoxue-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: redis-server /usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Redis 从节点（可选，启用 HA profile 时启动）──
  redis-secondary:
    image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    container_name: guoxue-redis-secondary
    restart: unless-stopped
    profiles: ["ha"]
    volumes:
      - ./redis-secondary.conf:/usr/local/etc/redis/redis.conf:ro
    command: redis-server /usr/local/etc/redis/redis.conf
    depends_on:
      redis:
        condition: service_healthy

  # ── Redis Sentinel ×3（可选，启用 HA profile 时启动，生产建议至少 3 节点）──
  redis-sentinel-1:
    image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    container_name: guoxue-redis-sentinel-1
    restart: unless-stopped
    profiles: ["ha"]
    ports:
      - "26379:26379"
    volumes:
      - ./redis-sentinel.conf:/etc/redis/sentinel.conf:ro
    command: redis-sentinel /etc/redis/sentinel.conf
    depends_on:
      - redis
      - redis-secondary

  redis-sentinel-2:
    image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    container_name: guoxue-redis-sentinel-2
    restart: unless-stopped
    profiles: ["ha"]
    ports:
      - "26380:26379"
    volumes:
      - ./redis-sentinel.conf:/etc/redis/sentinel.conf:ro
    command: redis-sentinel /etc/redis/sentinel.conf
    depends_on:
      - redis
      - redis-secondary

  redis-sentinel-3:
    image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    container_name: guoxue-redis-sentinel-3
    restart: unless-stopped
    profiles: ["ha"]
    ports:
      - "26381:26379"
    volumes:
      - ./redis-sentinel.conf:/etc/redis/sentinel.conf:ro
    command: redis-sentinel /etc/redis/sentinel.conf
    depends_on:
      - redis
      - redis-secondary

  # ── 反向代理 ──
  nginx:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    container_name: guoxue-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf.template:/etc/nginx/templates/nginx.conf.template:ro
      - ./nginx/security-headers.conf:/etc/nginx/snippets/security-headers.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - uploads_data:/var/www/uploads
      - static_data:/var/www/static
      - certbot_data:/var/www/certbot
      - admin_dist:/var/www/admin
      - h5_dist:/var/www/h5
    environment:
      NGINX_ENVSUBST_FILTER: "^(NGINX_SERVER_NAMES)$"
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx
      NGINX_SERVER_NAMES: ${NGINX_SERVER_NAMES:-localhost}
    depends_on:
      - server
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost/nginx-health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── 后端服务 ──
  server:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: guoxue-server
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - admin_dist:/app/admin-dist-shared
      - h5_dist:/app/h5-dist-shared
    environment:
      # ── 基础设施 ──
      DATABASE_URL: postgresql://guoxue:guoxue123@postgres:5432/guoxue?connection_limit=20
      DATABASE_REPLICA_URL: ${DATABASE_REPLICA_URL:-}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-change-me-in-production-32ch}
      BIGSCREEN_SECRET: ${BIGSCREEN_SECRET:-change-me-in-production}
      PORT: 3000
      RUN_DB_MIGRATIONS: ${RUN_DB_MIGRATIONS:-false}
      NODE_ENV: ${NODE_ENV:-production}
      RELEASE_ID: ${RELEASE_ID:-unversioned}
      PRISMA_SLOW_QUERY_MS: ${PRISMA_SLOW_QUERY_MS:-500}
      CORS_ORIGIN: ${CORS_ORIGIN:-}

      # ── 腾讯云基础凭证（AI/OCR/ASR/NLP/SMS/Live/VOD 复用） ──
      TENCENT_SECRET_ID: ${TENCENT_SECRET_ID:-}
      TENCENT_SECRET_KEY: ${TENCENT_SECRET_KEY:-}
      TENCENT_CREDENTIAL_MODE: ${TENCENT_CREDENTIAL_MODE:-static}
      TENCENT_CVM_ROLE_NAME: ${TENCENT_CVM_ROLE_NAME:-}
      TENCENT_APP_ID: ${TENCENT_APP_ID:-}
      TENCENT_CALLBACK_KEY: ${TENCENT_CALLBACK_KEY:-}
      TENCENT_ASR_REGION: ${TENCENT_ASR_REGION:-}
      TENCENT_ASR_ENGINE: ${TENCENT_ASR_ENGINE:-}
      TENCENT_TTS_REGION: ${TENCENT_TTS_REGION:-}
      TENCENT_AIART_REGION: ${TENCENT_AIART_REGION:-}
      CONTENT_MODERATION_REGION: ${CONTENT_MODERATION_REGION:-}

      # ── 腾讯云 COS ──
      COS_SECRET_ID: ${COS_SECRET_ID:-}
      COS_SECRET_KEY: ${COS_SECRET_KEY:-}
      COS_BUCKET: ${COS_BUCKET:-}
      COS_REGION: ${COS_REGION:-ap-guangzhou}
      COS_CDN_BASE: ${COS_CDN_BASE:-}
      COS_DOMAIN: ${COS_DOMAIN:-}
      CDN_DOMAIN: ${CDN_DOMAIN:-}

      # ── 腾讯云 IM ──
      IM_APP_ID: ${IM_APP_ID:-}
      IM_ADMIN_KEY: ${IM_ADMIN_KEY:-}
      IM_ADMIN_ID: ${IM_ADMIN_ID:-}
      IM_AUDIT_SAMPLE: ${IM_AUDIT_SAMPLE:-}
      IM_CALLBACK_TOKEN: ${IM_CALLBACK_TOKEN:-}

      # ── 腾讯云实时音视频 ──
      TRTC_SDK_APP_ID: ${TRTC_SDK_APP_ID:-}
      TRTC_SECRET_KEY: ${TRTC_SECRET_KEY:-}

      # ── 腾讯云直播 ──
      LIVE_PUSH_DOMAIN: ${LIVE_PUSH_DOMAIN:-}
      LIVE_PLAY_DOMAIN: ${LIVE_PLAY_DOMAIN:-}
      LIVE_PUSH_KEY: ${LIVE_PUSH_KEY:-}
      LIVE_PLAY_KEY: ${LIVE_PLAY_KEY:-}
      LIVE_APP_NAME: ${LIVE_APP_NAME:-}

      # ── 腾讯云点播 ──
      VOD_SUB_APP_ID: ${VOD_SUB_APP_ID:-}
      VOD_PLAY_KEY: ${VOD_PLAY_KEY:-}

      # ── 腾讯云短信 ──
      SMS_APP_ID: ${SMS_APP_ID:-}
      SMS_SIGN_NAME: ${SMS_SIGN_NAME:-}
      SMS_TEMPLATE_ID: ${SMS_TEMPLATE_ID:-}
      SMS_CHURN_TEMPLATE_ID: ${SMS_CHURN_TEMPLATE_ID:-}
      SMS_REGION: ${SMS_REGION:-}

      # ── 腾讯地图 ──
      TENCENT_MAP_KEY: ${TENCENT_MAP_KEY:-}
      TENCENT_MAP_SK: ${TENCENT_MAP_SK:-}

      # ── AI ──
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-https://api.anthropic.com}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      DASHSCOPE_BASE_URL: ${DASHSCOPE_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      LOCAL_MODEL_BASE_URL: ${LOCAL_MODEL_BASE_URL:-http://localhost:11434/v1}
      LOCAL_MODEL_API_KEY: ${LOCAL_MODEL_API_KEY:-}

      # ── 微信开放平台 ──
      WECHAT_APP_ID: ${WECHAT_APP_ID:-}
      WECHAT_APP_SECRET: ${WECHAT_APP_SECRET:-}
      WECHAT_MINI_APP_ID: ${WECHAT_MINI_APP_ID:-}
      MINIPROGRAM_APP_ID: ${MINIPROGRAM_APP_ID:-}
      MINIPROGRAM_APP_SECRET: ${MINIPROGRAM_APP_SECRET:-}
      WECHAT_MP_APP_ID: ${WECHAT_MP_APP_ID:-}
      WECHAT_OFFICIAL_APPID: ${WECHAT_OFFICIAL_APPID:-}
      WECHAT_OFFICIAL_APP_SECRET: ${WECHAT_OFFICIAL_APP_SECRET:-}
      WECHAT_OPEN_APP_ID: ${WECHAT_OPEN_APP_ID:-}
      WECHAT_OPEN_APP_SECRET: ${WECHAT_OPEN_APP_SECRET:-}
      WECHAT_OPEN_PLATFORM_ID: ${WECHAT_OPEN_PLATFORM_ID:-}
      WECHAT_LOGIN_CLIENTS_JSON: ${WECHAT_LOGIN_CLIENTS_JSON:-}

      # ── 微信支付 V3 ──
      WECHAT_PAY_APP_ID: ${WECHAT_PAY_APP_ID:-}
      WECHAT_PAY_MCH_ID: ${WECHAT_PAY_MCH_ID:-}
      WECHAT_PAY_ALLOWED_MCH_ID: ${WECHAT_PAY_ALLOWED_MCH_ID:-}
      WECHAT_PAY_SERIAL_NO: ${WECHAT_PAY_SERIAL_NO:-}
      WECHAT_PAY_API_V3_KEY: ${WECHAT_PAY_API_V3_KEY:-}
      WECHAT_PAY_PRIVATE_KEY_PATH: ${WECHAT_PAY_PRIVATE_KEY_PATH:-}
      WECHAT_PAY_PRIVATE_KEY: ${WECHAT_PAY_PRIVATE_KEY:-}
      WECHAT_PAY_PUBLIC_KEY: ${WECHAT_PAY_PUBLIC_KEY:-}
      WECHAT_PAY_PUBLIC_KEY_ID: ${WECHAT_PAY_PUBLIC_KEY_ID:-}
      WECHAT_PAY_NOTIFY_URL: ${WECHAT_PAY_NOTIFY_URL:-}
      WECHAT_PAY_REFUND_NOTIFY_URL: ${WECHAT_PAY_REFUND_NOTIFY_URL:-}
      WECHAT_PAY_TRANSFER_NOTIFY_URL: ${WECHAT_PAY_TRANSFER_NOTIFY_URL:-}
      WECHAT_TRANSFER_NOTIFY_URL: ${WECHAT_TRANSFER_NOTIFY_URL:-}
      WECHAT_TRANSFER_SCENE_ID: ${WECHAT_TRANSFER_SCENE_ID:-}

      # ── Apple 应用内购买 ──
      APPLE_IAP_KEY_ID: ${APPLE_IAP_KEY_ID:-}
      APPLE_IAP_REQUIRED: ${APPLE_IAP_REQUIRED:-false}
      APPLE_IAP_ISSUER_ID: ${APPLE_IAP_ISSUER_ID:-}
      APPLE_IAP_PRIVATE_KEY_BASE64: ${APPLE_IAP_PRIVATE_KEY_BASE64:-}
      APPLE_IAP_PRIVATE_KEY: ${APPLE_IAP_PRIVATE_KEY:-}
      APPLE_IAP_BUNDLE_ID: ${APPLE_IAP_BUNDLE_ID:-com.rebu.iosapprebu}
      APPLE_IAP_APP_APPLE_ID: ${APPLE_IAP_APP_APPLE_ID:-6756602923}
      APPLE_IAP_ENVIRONMENT: ${APPLE_IAP_ENVIRONMENT:-AUTO}
      APPLE_IAP_PRODUCTS_JSON: ${APPLE_IAP_PRODUCTS_JSON:-}

      # ── 支付宝 ──
      ALIPAY_APP_ID: ${ALIPAY_APP_ID:-}
      ALIPAY_SANDBOX: ${ALIPAY_SANDBOX:-}
      ALIPAY_PRIVATE_KEY_PATH: ${ALIPAY_PRIVATE_KEY_PATH:-}
      ALIPAY_PRIVATE_KEY: ${ALIPAY_PRIVATE_KEY:-}
      ALIPAY_PUBLIC_KEY_PATH: ${ALIPAY_PUBLIC_KEY_PATH:-}
      ALIPAY_PUBLIC_KEY: ${ALIPAY_PUBLIC_KEY:-}
      ALIPAY_NOTIFY_URL: ${ALIPAY_NOTIFY_URL:-}

      # ── 银联支付 ──
      UNIONPAY_MER_ID: ${UNIONPAY_MER_ID:-}
      UNIONPAY_SANDBOX: ${UNIONPAY_SANDBOX:-}
      UNIONPAY_PFX_PATH: ${UNIONPAY_PFX_PATH:-}
      UNIONPAY_PFX_PASSWORD: ${UNIONPAY_PFX_PASSWORD:-}
      UNIONPAY_PRIVATE_KEY: ${UNIONPAY_PRIVATE_KEY:-}
      UNIONPAY_PUBLIC_KEY_PATH: ${UNIONPAY_PUBLIC_KEY_PATH:-}
      UNIONPAY_PUBLIC_KEY: ${UNIONPAY_PUBLIC_KEY:-}
      UNIONPAY_NOTIFY_URL: ${UNIONPAY_NOTIFY_URL:-}

      # ── 汇付斗拱支付/分账 ──
      HUIFU_BASE_URL: ${HUIFU_BASE_URL:-}
      HUIFU_APP_ID: ${HUIFU_APP_ID:-}
      HUIFU_MERCHANT_ID: ${HUIFU_MERCHANT_ID:-}
      HUIFU_UPPER_HUIFU_ID: ${HUIFU_UPPER_HUIFU_ID:-}
      HUIFU_PRODUCT_ID: ${HUIFU_PRODUCT_ID:-}
      HUIFU_SECRET_KEY: ${HUIFU_SECRET_KEY:-}
      HUIFU_RSA_PRIVATE_KEY: ${HUIFU_RSA_PRIVATE_KEY:-}
      HUIFU_RSA_PUBLIC_KEY: ${HUIFU_RSA_PUBLIC_KEY:-}
      HUIFU_NOTIFY_URL: ${HUIFU_NOTIFY_URL:-}
      HUIFU_MIGRATE_LEGACY_CONFIG: ${HUIFU_MIGRATE_LEGACY_CONFIG:-false}

      # ── 快递物流 ──
      KUAIDI100_API_KEY: ${KUAIDI100_API_KEY:-}
      KUAIDI100_CUSTOMER: ${KUAIDI100_CUSTOMER:-}
      KUAIDI100_CALLBACK_URL: ${KUAIDI100_CALLBACK_URL:-}
      KUAIDI100_SALT: ${KUAIDI100_SALT:-}

      # ── 企业微信机器人 ──
      WEWORK_WEBHOOK_URL: ${WEWORK_WEBHOOK_URL:-}
      WEWORK_WEBHOOK_ALERT_URL: ${WEWORK_WEBHOOK_ALERT_URL:-}

      # ── COZE 智能体 ──
      COZE_API_KEY: ${COZE_API_KEY:-}
      COZE_BOT_ID: ${COZE_BOT_ID:-}
      COZE_API_BASE: ${COZE_API_BASE:-https://api.coze.cn}
      COZE_OAUTH_CLIENT_ID: ${COZE_OAUTH_CLIENT_ID:-}
      COZE_OAUTH_PUBLIC_KEY_ID: ${COZE_OAUTH_PUBLIC_KEY_ID:-}
      COZE_OAUTH_PRIVATE_KEY: ${COZE_OAUTH_PRIVATE_KEY:-}

      # ── 旧排盘兼容入口（切换期保留） ──
      PAIPAN_LEGACY_MODE: ${PAIPAN_LEGACY_MODE:-false}
      PAIPAN_H5_BASE: ${PAIPAN_H5_BASE:-}

      # ── 邮件服务 ──
      EMAIL_MODE: ${EMAIL_MODE:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_API_URL: ${EMAIL_API_URL:-}
      EMAIL_API_KEY: ${EMAIL_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "require(''http'').get(''http://localhost:3000/api/v1/health'', r => {process.exit(r.statusCode === 200 ? 0 : 1)})"',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  pgdata-replica:
  redisdata:
  uploads_data:
  static_data:
  certbot_data:
  admin_dist:
  h5_dist:
