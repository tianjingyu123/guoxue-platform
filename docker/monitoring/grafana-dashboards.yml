# ═══════════════════════════════════════════════════════════════
# 国学平台 — Grafana Dashboard 自动加载配置
# ═══════════════════════════════════════════════════════════════

apiVersion: 1

providers:
  - name: "guoxue-dashboards"
    orgId: 1
    folder: "国学平台"
    type: file
    disableDeletion: true
    editable: true
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/dashboards
