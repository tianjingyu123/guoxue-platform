# ═══════════════════════════════════════════════════════════════
# 国学平台 — 监控栈 Docker Compose
# 启动前先渲染告警配置，完整步骤见本目录 README.md
# ═══════════════════════════════════════════════════════════════

services:
  # ═══════════ Prometheus — 指标采集与时序存储 ═══════════
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: guoxue-prometheus
    volumes:
      - ./.generated/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - monitoring
    restart: unless-stopped

  # ═══════════ Grafana — 可视化看板 ═══════════
  grafana:
    image: grafana/grafana:11.5.0
    container_name: guoxue-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:?生产监控必须设置 GF_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: ""
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/grafana"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/api-overview.json
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./dashboards:/etc/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3001:3000"
    networks:
      - monitoring
    restart: unless-stopped
    depends_on:
      - prometheus

  # ═══════════ Alertmanager — 告警路由 ═══════════
  alertmanager:
    image: prom/alertmanager:v0.28.0
    container_name: guoxue-alertmanager
    volumes:
      - ./.generated/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    ports:
      - "127.0.0.1:9093:9093"
    networks:
      - monitoring
    restart: unless-stopped

  # ═══════════ Loki — 日志聚合 ═══════════
  loki:
    image: grafana/loki:3.3.0
    container_name: guoxue-loki
    volumes:
      - loki_data:/loki
      - ./loki-config.yml:/etc/loki/local-config.yaml:ro
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "127.0.0.1:3100:3100"
    networks:
      - monitoring
    restart: unless-stopped

  # ═══════════ Promtail — 日志采集 Agent ═══════════
  promtail:
    image: grafana/promtail:3.3.0
    container_name: guoxue-promtail
    volumes:
      - /var/log:/var/log:ro
      - ./promtail-config.yml:/etc/promtail/config.yml:ro
      - ../apps/server/logs:/var/log/guoxue:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - monitoring
    restart: unless-stopped
    depends_on:
      - loki

  # ═══════════ Node Exporter — 主机指标 ═══════════
  node-exporter:
    image: prom/node-exporter:v1.9.0
    container_name: guoxue-node-exporter
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--collector.filesystem.mount-points-exclude=^(sys|proc|dev|host|etc)($$|/)"
    networks:
      - monitoring
    restart: unless-stopped

  # ═══════════ PostgreSQL Exporter — DB 指标 ═══════════
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    container_name: guoxue-postgres-exporter
    environment:
      DATA_SOURCE_NAME: ${DATABASE_URL:?监控栈必须读取生产 DATABASE_URL}
    networks:
      - monitoring
    restart: unless-stopped

  # ═══════════ Redis Exporter — 缓存指标 ═══════════
  redis-exporter:
    image: oliver006/redis_exporter:v1.67.0
    container_name: guoxue-redis-exporter
    environment:
      REDIS_ADDR: ${REDIS_URL:?监控栈必须读取生产 REDIS_URL}
    networks:
      - monitoring
    restart: unless-stopped

  # ═══════════ Tempo — 分布式追踪后端 ═══════════
  tempo:
    image: grafana/tempo:2.7.0
    container_name: guoxue-tempo
    volumes:
      - ./tempo-config.yml:/etc/tempo/config.yml:ro
      - tempo_data:/var/tempo
    command:
      - "-config.file=/etc/tempo/config.yml"
    networks:
      - monitoring
    restart: unless-stopped

  # ═══════════ Blackbox Exporter — 第三方服务拨测 ═══════════
  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    container_name: guoxue-blackbox-exporter
    command:
      - "--config.file=/etc/blackbox/blackbox.yml"
    volumes:
      - ./blackbox.yml:/etc/blackbox/blackbox.yml:ro
    networks:
      - monitoring
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:
  loki_data:
  tempo_data:

networks:
  monitoring:
    external: true
