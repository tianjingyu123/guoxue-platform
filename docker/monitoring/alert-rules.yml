# ═══════════════════════════════════════════════════════════════
# 国学平台 — Prometheus 告警规则
# 分组：接口质量 / 支付监控 / 第三方服务 / 系统资源
# ═══════════════════════════════════════════════════════════════

groups:

# ═══════════ 一、接口质量 ═══════════
- name: guoxue-api-quality
  rules:

  # 1.1 接口错误率 >1%（5分钟窗口）
  - alert: HighErrorRate
    expr: |
      (
        sum(rate(guoxue_http_requests_total{status=~"5.."}[5m]))
        /
        sum(rate(guoxue_http_requests_total[5m]))
      ) > 0.01
    for: 2m
    labels:
      severity: critical
      category: api
    annotations:
      summary: "API 5xx 错误率超过 1%"
      description: "当前 5xx 错误率 {{ $value | humanizePercentage }}，阈值 1%"
      runbook: "检查应用日志中的错误堆栈，确认 DB/Redis 连接状态，回滚最近部署"

  # 1.2 接口 4xx 错误率 >10%
  - alert: HighClientErrorRate
    expr: |
      (
        sum(rate(guoxue_http_requests_total{status=~"4.."}[5m]))
        /
        sum(rate(guoxue_http_requests_total[5m]))
      ) > 0.10
    for: 5m
    labels:
      severity: warning
      category: api
    annotations:
      summary: "API 4xx 错误率超过 10%"
      description: "当前 4xx 错误率 {{ $value | humanizePercentage }}，可能是前端 bug 或被攻击"

  # 1.3 P95 延迟超过 2s
  - alert: HighLatency
    expr: |
      histogram_quantile(0.95,
        sum(rate(guoxue_http_request_duration_seconds_bucket[5m])) by (le, path)
      ) > 2
    for: 3m
    labels:
      severity: warning
      category: api
    annotations:
      summary: "{{ $labels.path }} P95 延迟超过 2s"
      description: "{{ $labels.path }} P95 延迟 = {{ $value }}s"
      runbook: "检查慢查询日志、Redis 命中率、DB 连接池状态"

  # 1.4 P99 延迟超过 5s
  - alert: CriticalLatency
    expr: |
      histogram_quantile(0.99,
        sum(rate(guoxue_http_request_duration_seconds_bucket[5m])) by (le, path)
      ) > 5
    for: 2m
    labels:
      severity: critical
      category: api
    annotations:
      summary: "{{ $labels.path }} P99 延迟超过 5s"
      description: "{{ $labels.path }} P99 延迟 = {{ $value }}s，用户体验严重恶化"

  # 1.5 首页延迟超过 1.5s
  - alert: HomePageSlow
    expr: |
      histogram_quantile(0.95,
        sum(rate(guoxue_http_request_duration_seconds_bucket{path="/api/content/home"}[5m])) by (le)
      ) > 1.5
    for: 3m
    labels:
      severity: warning
      category: api
    annotations:
      summary: "首页 P95 延迟 > 1.5s"
      description: "首页 P95 延迟 = {{ $value }}s"

  # 1.6 排盘延迟超过 2s
  - alert: PaipanSlow
    expr: |
      histogram_quantile(0.95,
        sum(rate(guoxue_http_request_duration_seconds_bucket{path=~"/api/paipan/.*"}[5m])) by (le, path)
      ) > 2
    for: 3m
    labels:
      severity: warning
      category: api
    annotations:
      summary: "排盘接口 P95 延迟 > 2s"
      description: "{{ $labels.path }} P95 延迟 = {{ $value }}s"

  # 1.7 搜索延迟超过 200ms
  - alert: SearchSlow
    expr: |
      histogram_quantile(0.95,
        sum(rate(guoxue_http_request_duration_seconds_bucket{path=~"/api/search.*"}[5m])) by (le)
      ) > 0.2
    for: 3m
    labels:
      severity: warning
      category: api
    annotations:
      summary: "搜索接口 P95 延迟 > 200ms"
      description: "搜索 P95 延迟 = {{ $value }}s"

  # 1.8 请求量突增（可能的攻击或流量异常）
  - alert: RequestSurge
    expr: |
      sum(rate(guoxue_http_requests_total[5m])) > 200
    for: 2m
    labels:
      severity: warning
      category: api
    annotations:
      summary: "请求量突增 > 200 QPS"
      description: "当前 QPS = {{ $value }}，可能是营销活动或 DDoS 攻击"

# ═══════════ 二、支付监控（最高优先级） ═══════════
- name: guoxue-payment
  rules:

  # 2.1 支付回调超过 30s 未收到
  # 由应用代码暴露 guoxue_payment_callback_delay_seconds gauge 指标
  - alert: PaymentCallbackDelayed
    expr: guoxue_payment_callback_delay_seconds > 30
    for: 30s
    labels:
      severity: critical
      category: payment
    annotations:
      summary: "支付回调延迟超过 30 秒"
      description: "订单 {{ $labels.orderId }} 支付后 {{ $value }}s 未收到回调"
      runbook: "检查微信支付/支付宝回调 URL 可达性，查看 Nginx 日志确认回调是否到达"

  # 2.2 支付回调失败率 >5%
  - alert: PaymentCallbackFailure
    expr: |
      (
        sum(rate(guoxue_payment_callback_failures_total[5m]))
        /
        sum(rate(guoxue_payment_callback_total[5m]))
      ) > 0.05
    for: 3m
    labels:
      severity: critical
      category: payment
    annotations:
      summary: "支付回调失败率 > 5%"
      description: "当前失败率 {{ $value | humanizePercentage }}"
      runbook: "检查验签逻辑、证书有效期、微信支付 API 状态"

  # 2.3 支付成功率 <95%
  - alert: LowPaymentSuccessRate
    expr: |
      (
        sum(rate(guoxue_http_requests_total{path=~"/api/shop/pay/notify.*", status=~"2.."}[10m]))
        /
        sum(rate(guoxue_http_requests_total{path=~"/api/shop/pay.*"}[10m]))
      ) < 0.95
    for: 5m
    labels:
      severity: critical
      category: payment
    annotations:
      summary: "支付成功率低于 95%"
      description: "当前支付成功率 {{ $value | humanizePercentage }}"

  # 2.4 待处理订单堆积
  - alert: PendingOrderBuildup
    expr: guoxue_orders_pending_count > 50
    for: 10m
    labels:
      severity: warning
      category: payment
    annotations:
      summary: "待支付订单堆积 > 50 单"
      description: "当前待支付订单数 = {{ $value }}，可能支付流程阻塞"

# ═══════════ 三、第三方服务 ═══════════
- name: guoxue-third-party
  rules:

  # 3.1 DeepSeek API 异常
  - alert: DeepSeekDown
    expr: |
      sum(rate(guoxue_external_api_failures_total{service="deepseek"}[5m])) > 0.1
    for: 3m
    labels:
      severity: warning
      category: third-party
    annotations:
      summary: "DeepSeek API 调用异常"
      description: "DeepSeek 最近 5 分钟失败率 {{ $value | humanizePercentage }}"

  # 3.2 腾讯云 COS 异常
  - alert: COSDown
    expr: |
      sum(rate(guoxue_external_api_failures_total{service="cos"}[5m])) > 0.05
    for: 3m
    labels:
      severity: warning
      category: third-party
    annotations:
      summary: "腾讯云 COS 调用异常（文件上传/下载受影响）"
      description: "COS 最近 5 分钟失败率 {{ $value | humanizePercentage }}"

  # 3.3 微信支付 API 异常
  - alert: WechatPayDown
    expr: |
      sum(rate(guoxue_external_api_failures_total{service="wechat_pay"}[5m])) > 0.05
    for: 2m
    labels:
      severity: critical
      category: third-party
    annotations:
      summary: "微信支付 API 异常（支付功能受影响）"
      description: "微信支付最近 5 分钟失败率 {{ $value | humanizePercentage }}"

  # 3.4 腾讯云 IM 异常
  - alert: IMDown
    expr: |
      sum(rate(guoxue_external_api_failures_total{service="im"}[5m])) > 0.1
    for: 5m
    labels:
      severity: warning
      category: third-party
    annotations:
      summary: "腾讯云 IM 异常（聊天/直播受影响）"
      description: "IM 最近 5 分钟失败率 {{ $value | humanizePercentage }}"

  # 3.5 第三方域名可达性
  - alert: ExternalServiceUnreachable
    expr: probe_success{job="guoxue-external-probes"} == 0
    for: 2m
    labels:
      severity: critical
      category: third-party
    annotations:
      summary: "{{ $labels.instance }} 不可达"
      description: "{{ $labels.instance }} blackbox 探测失败"

# ═══════════ 四、数据库 ═══════════
- name: guoxue-database
  rules:

  # 4.1 DB 连接池使用率 >80%
  - alert: DBConnectionPoolHigh
    expr: |
      (
        pg_stat_activity_count{datname="guoxue"}
        /
        pg_settings_max_connections{datname="guoxue"}
      ) > 0.8
    for: 5m
    labels:
      severity: warning
      category: database
    annotations:
      summary: "数据库连接池使用率 > 80%"
      description: "当前 {{ $value | humanizePercentage }}，共 {{ $labels.pg_stat_activity_count }} 个活跃连接"

  # 4.2 DB 连接池耗尽
  - alert: DBConnectionPoolExhausted
    expr: |
      (
        pg_stat_activity_count{datname="guoxue"}
        /
        pg_settings_max_connections{datname="guoxue"}
      ) > 0.95
    for: 1m
    labels:
      severity: critical
      category: database
    annotations:
      summary: "数据库连接池即将耗尽 > 95%"
      description: "当前 {{ $value | humanizePercentage }}"
      runbook: "立即检查是否有未释放的连接、卡住的查询，考虑扩容连接数"

  # 4.3 流复制延迟 > 5s
  - alert: ReplicationLag
    expr: pg_stat_replication_flush_lag_seconds > 5
    for: 2m
    labels:
      severity: warning
      category: database
    annotations:
      summary: "PostgreSQL 流复制延迟 > 5 秒"
      description: "当前延迟 {{ $value }}s"

  # 4.4 流复制中断
  - alert: ReplicationDown
    expr: pg_stat_replication_status == 0
    for: 1m
    labels:
      severity: critical
      category: database
    annotations:
      summary: "PostgreSQL 流复制中断"
      description: "Standby 节点未连接，数据无冗余保护"

  # 4.5 死锁发生
  - alert: DeadlockDetected
    expr: rate(pg_stat_database_deadlocks{datname="guoxue"}[5m]) > 0
    for: 1m
    labels:
      severity: warning
      category: database
    annotations:
      summary: "数据库出现死锁"
      description: "最近 5 分钟发生 {{ $value }} 次死锁"

  # 4.6 慢查询数量 >50/小时
  - alert: SlowQueriesSpike
    expr: rate(guoxue_slow_query_total[1h]) > 50
    for: 10m
    labels:
      severity: warning
      category: database
    annotations:
      summary: "数据库慢查询激增 > 50/h"
      description: "最近 1 小时慢查询速率 {{ $value }}/s"

# ═══════════ 五、Redis ═══════════
- name: guoxue-redis
  rules:

  # 5.1 Redis 不可用
  - alert: RedisDown
    expr: redis_up == 0
    for: 30s
    labels:
      severity: critical
      category: cache
    annotations:
      summary: "Redis 服务不可用"
      description: "Redis 实例 {{ $labels.instance }} 宕机，缓存全面降级为内存"
      runbook: "检查 Redis 进程、内存、磁盘，必要时重启 Redis"

  # 5.2 Redis 内存使用率 >80%
  - alert: RedisMemoryHigh
    expr: |
      (redis_memory_used_bytes / redis_memory_max_bytes) > 0.8
    for: 5m
    labels:
      severity: warning
      category: cache
    annotations:
      summary: "Redis 内存使用率 > 80%"
      description: "当前 {{ $value | humanizePercentage }}，已用 {{ $labels.redis_memory_used_bytes }}"

  # 5.3 Redis 内存即将满
  - alert: RedisMemoryCritical
    expr: |
      (redis_memory_used_bytes / redis_memory_max_bytes) > 0.95
    for: 2m
    labels:
      severity: critical
      category: cache
    annotations:
      summary: "Redis 内存即将满 > 95%"
      description: "当前 {{ $value | humanizePercentage }}，驱逐风险极高"

  # 5.4 Redis 缓存命中率 <80%
  - alert: RedisCacheHitRateLow
    expr: |
      (
        rate(redis_keyspace_hits_total[5m])
        /
        (rate(redis_keyspace_hits_total[5m]) + rate(redis_keyspace_misses_total[5m]))
      ) < 0.8
    for: 10m
    labels:
      severity: warning
      category: cache
    annotations:
      summary: "Redis 缓存命中率 < 80%"
      description: "当前命中率 {{ $value | humanizePercentage }}"

  # 5.5 Redis 连接数 > 80%
  - alert: RedisConnectionsHigh
    expr: redis_connected_clients / redis_config_maxclients > 0.8
    for: 5m
    labels:
      severity: warning
      category: cache
    annotations:
      summary: "Redis 连接数使用率 > 80%"
      description: "当前连接数 {{ $value }}"

# ═══════════ 六、系统资源 ═══════════
- name: guoxue-system
  rules:

  # 6.1 应用进程 CPU > 80%
  - alert: HighCPUUsage
    expr: |
      rate(process_cpu_seconds_total{job="guoxue-server"}[1m]) * 100 > 80
    for: 5m
    labels:
      severity: warning
      category: system
    annotations:
      summary: "应用 CPU 使用率 > 80%"
      description: "当前 CPU {{ $value }}%"

  # 6.2 应用内存 > 80%
  - alert: HighMemoryUsage
    expr: |
      process_resident_memory_bytes{job="guoxue-server"}
      / node_memory_MemTotal_bytes > 0.8
    for: 5m
    labels:
      severity: warning
      category: system
    annotations:
      summary: "应用内存使用 > 80%"
      description: "当前内存 {{ $value | humanizePercentage }}"

  # 6.3 磁盘使用 > 85%
  - alert: DiskSpaceLow
    expr: |
      (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) < 0.15
    for: 5m
    labels:
      severity: critical
      category: system
    annotations:
      summary: "磁盘可用空间 < 15%"
      description: "根分区可用空间仅 {{ $value | humanizePercentage }}"

  # 6.4 应用实例突然减少
  - alert: InstanceDown
    expr: up{job="guoxue-server"} == 0
    for: 30s
    labels:
      severity: critical
      category: system
    annotations:
      summary: "应用实例 {{ $labels.instance }} 宕机"
      description: "实例 {{ $labels.instance }} 停止响应"

  # 6.5 Event Loop 阻塞
  - alert: EventLoopLag
    expr: nodejs_eventloop_lag_seconds > 0.1
    for: 3m
    labels:
      severity: warning
      category: system
    annotations:
      summary: "Node.js Event Loop 阻塞 > 100ms"
      description: "当前 Event Loop 延迟 {{ $value }}s，可能影响吞吐量"

  # 6.6 Pod 频繁重启
  - alert: FrequentRestarts
    expr: rate(kube_pod_container_status_restarts_total{container="guoxue-server"}[15m]) > 0
    for: 5m
    labels:
      severity: warning
      category: system
    annotations:
      summary: "应用容器频繁重启"
      description: "最近 15 分钟内 Pod {{ $labels.pod }} 重启 {{ $value }} 次"
