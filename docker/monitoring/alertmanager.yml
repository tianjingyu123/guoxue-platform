# ═══════════════════════════════════════════════════════════════
# 国学平台 — Alertmanager 告警路由配置
# ═══════════════════════════════════════════════════════════════

global:
  resolve_timeout: 5m

# 路由树 — 按 severity + category 分组路由
route:
  receiver: "default"
  group_by: ["alertname", "category", "severity"]
  group_wait: 10s        # 首次告警等待，合并同组通知
  group_interval: 5m     # 同组后续告警间隔
  repeat_interval: 4h    # 已解决告警重复通知间隔

  routes:
    # ── 支付告警 — 立即通知 ──
    - match:
        category: payment
      group_wait: 5s      # 支付告警 5s 极速通知
      repeat_interval: 10m
      receiver: "payment-critical"

    # ── Critical 级别 — 企业微信 + 电话 ──
    - match:
        severity: critical
      group_wait: 10s
      receiver: "critical"

    # ── Warning 级别 — 企业微信 ──
    - match:
        severity: warning
      group_wait: 30s
      receiver: "warning"

    # ── 数据库告警 — DBA 群组 ──
    - match:
        category: database
      receiver: "dba-team"

# 接收者配置
receivers:
  # 默认：企业微信管理群
  - name: "default"
    wechat_configs:
      - corp_id: "${WEWORK_CORP_ID}"
        to_party: "2"
        agent_id: "${WEWORK_AGENT_ID}"
        api_secret: "${WEWORK_AGENT_SECRET}"
        message: |
          【国学平台告警】
          告警: {{ .CommonAnnotations.summary }}
          详情: {{ .CommonAnnotations.description }}
          级别: {{ .CommonLabels.severity }}
          时间: {{ .StartsAt.Format "2006-01-02 15:04:05" }}

  # 支付相关 — 企业微信 + 短信
  - name: "payment-critical"
    wechat_configs:
      - corp_id: "${WEWORK_CORP_ID}"
        to_party: "3"
        agent_id: "${WEWORK_AGENT_ID}"
        api_secret: "${WEWORK_AGENT_SECRET}"
        message: |
          【⚠️ 支付告警】
          告警: {{ .CommonAnnotations.summary }}
          详情: {{ .CommonAnnotations.description }}
          Runbook: {{ .CommonAnnotations.runbook }}
          时间: {{ .StartsAt.Format "2006-01-02 15:04:05" }}

  # Critical 级别
  - name: "critical"
    wechat_configs:
      - corp_id: "${WEWORK_CORP_ID}"
        to_party: "1"
        agent_id: "${WEWORK_AGENT_ID}"
        api_secret: "${WEWORK_AGENT_SECRET}"
        message: |
          【🔥 严重告警】
          告警: {{ .CommonAnnotations.summary }}
          详情: {{ .CommonAnnotations.description }}
          Runbook: {{ .CommonAnnotations.runbook }}
          时间: {{ .StartsAt.Format "2006-01-02 15:04:05" }}

  # Warning 级别
  - name: "warning"
    wechat_configs:
      - corp_id: "${WEWORK_CORP_ID}"
        to_party: "2"
        agent_id: "${WEWORK_AGENT_ID}"
        api_secret: "${WEWORK_AGENT_SECRET}"
        message: |
          【⚡ 告警通知】
          告警: {{ .CommonAnnotations.summary }}
          详情: {{ .CommonAnnotations.description }}
          时间: {{ .StartsAt.Format "2006-01-02 15:04:05" }}

  # DBA 团队专用
  - name: "dba-team"
    wechat_configs:
      - corp_id: "${WEWORK_CORP_ID}"
        to_user: "${DBA_WEWORK_USER_IDS}"
        agent_id: "${WEWORK_AGENT_ID}"
        api_secret: "${WEWORK_AGENT_SECRET}"
        message: |
          【🗄️ 数据库告警】
          {{ .CommonAnnotations.summary }}
          {{ .CommonAnnotations.description }}
          时间: {{ .StartsAt.Format "2006-01-02 15:04:05" }}

# 抑制规则
inhibit_rules:
  # 实例宕机时，抑制该实例的其他告警
  - source_match:
      alertname: "InstanceDown"
    target_match_re:
      alertname: "^(HighErrorRate|HighLatency|RedisDown).*"
    equal: ["instance"]

  # 数据库宕机时，抑制 API 延迟告警
  - source_match:
      alertname: "DBConnectionPoolExhausted"
    target_match:
      category: "api"
    equal: ["instance"]
