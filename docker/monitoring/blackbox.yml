# ═══════════════════════════════════════════════════════════════
# 国学平台 — Blackbox Exporter 拨测配置
# ═══════════════════════════════════════════════════════════════

modules:
  http_2xx:
    prober: http
    timeout: 10s
    http:
      valid_status_codes: [200, 201, 204, 301, 302, 307, 308]
      method: GET
      no_follow_redirects: false
      fail_if_ssl: false
      fail_if_not_ssl: false
      tls_config:
        insecure_skip_verify: false
