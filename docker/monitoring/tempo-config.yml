# ═══════════════════════════════════════════════════════════════
# 国学平台 — Grafana Tempo 分布式追踪配置
# OTLP HTTP 接收端，兼容 OpenTelemetry SDK
# ═══════════════════════════════════════════════════════════════

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: "0.0.0.0:4318"

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 48h

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces
    wal:
      path: /var/tempo/wal
