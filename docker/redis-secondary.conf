# Redis 从节点配置 — 国学平台读扩展
# 主节点宕机时，Sentinel 会将此节点提升为新的主节点

port 6380
daemonize no

# 复制主节点
replicaof redis 6379

# 从节点只读
replica-read-only yes

# 持久化（与主节点保持一致）
appendonly yes
appendfsync everysec

# 内存限制
maxmemory 256mb
maxmemory-policy allkeys-lru

# 安全加固
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command KEYS ""
