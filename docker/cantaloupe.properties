# ============================================================
# Cantaloupe IIIF 图像服务器配置
# 版本：5.0.5
# 用途：古籍原图对照 — 提供 IIIF Image API 2.1 + 3.0
# ============================================================

# ── 网络 ──
http.host = 0.0.0.0
http.port = 8182
http.http2.enabled = true
http.https.enabled = false

# ── 日志 ──
log.application.level = INFO
log.access.ConsoleAppender.enabled = true

# ── 源文件系统（从 MinIO/S3 读取） ──
source.static = FilesystemSource
FilesystemSource.BasicLookupStrategy.path_prefix = /data/images

# 也支持 S3 源（生产推荐）
# source.static = S3Source
# S3Source.endpoint = http://minio:9000
# S3Source.access_key_id = guoxue_admin
# S3Source.secret_key = guoxue_minio_2024
# S3Source.bucket.name = guoxue-classic-images
# S3Source.BasicLookupStrategy.path_prefix =

# ── 缓存 ──
cache.source = FilesystemCache
FilesystemCache.pathname = /var/cache/cantaloupe

# ── 处理器 ──
# 自动选择最佳处理器（Java2D > OpenJpeg > ImageMagick）
processor.selection_strategy = AutomaticSelectionStrategy

# OpenJpegProcessor（推荐，JP2 支持好）
# OpenJpegProcessor.path_to_binaries = /usr/bin

# ImageMagick（兜底）
processor.imageio = ImageMagickProcessor
processor.fallback = Java2DProcessor

# ── 水印（暂不启用） ──
watermark.enabled = false

# ── IIIF API 版本 ──
endpoint.iiif.1.enabled = true
endpoint.iiif.3.enabled = true

# ── 最大图像尺寸 ──
max_pixels = 64000000

# ── CORS ──
delegate_script.enabled = false

# ── 管理端点 ──
admin.enabled = true
admin.password = ${CANTALOUPE_ADMIN_PASSWORD:-admin123}
